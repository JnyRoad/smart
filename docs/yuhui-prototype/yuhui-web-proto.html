<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>智慧园区后台原型</title>
<style>
/* ===== 全局（复刻 smart-ui 主题 theme-yutong） ===== */
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB",SimSun,sans-serif;font-size:14px;color:#333;background:#f0f2f5}
a{text-decoration:none}
/* 顶栏 */
.hd{position:fixed;top:0;left:0;right:0;height:64px;background:#fff;box-shadow:0 1px 4px rgba(0,21,41,.08);z-index:100;display:flex;align-items:center;padding-left:240px}
.logo{position:fixed;top:0;left:0;width:240px;height:64px;background:#141E37;z-index:101;display:flex;align-items:center;justify-content:center;gap:10px}
.logo b{color:#fff;font-size:17px;letter-spacing:.2em;font-weight:600}
.logo span{display:inline-block;background:#ed6d00;color:#fff;font-weight:800;font-size:13px;letter-spacing:.18em;padding:3px 8px 3px 10px;border-radius:4px}
.hd .burger{margin-left:20px;font-size:20px;color:#666;cursor:pointer;user-select:none}
.hd .tlink{margin-left:46px;color:#666;font-size:16px;cursor:pointer}
.hd .sp{flex:1}
.hd .r{display:flex;align-items:center;gap:26px;padding-right:20px;color:rgba(0,0,0,.65)}
.hd .r .tbtn{color:#ed6d00;cursor:pointer;font-size:14px}
.hd .r .usr{cursor:pointer}
/* 侧栏 */
.sb{position:fixed;top:0;left:0;bottom:0;width:240px;background:#0e1424;padding-top:74px;z-index:99;overflow-y:auto;box-shadow:2px 0 6px rgba(0,21,41,.35)}
.sb::-webkit-scrollbar{width:0}
.mi,.msub{height:45px;line-height:45px;padding:0 20px;color:rgba(255,255,255,.7);font-size:14px;cursor:pointer;position:relative;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mi:hover,.msub:hover{color:#fff}
.mi.on{background:rgba(0,0,0,.8);color:#fff}
.mi.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#ed6d00}
.msub{justify-content:space-between}
.msub .ar{transition:transform .2s;font-size:12px}
.msub.open .ar{transform:rotate(180deg)}
.mgrp .mi{padding-left:44px}
.mgrp{display:none}
.mgrp.open{display:block}
.newdot{background:#ed6d00;color:#fff;font-size:10px;border-radius:4px;padding:0 4px;line-height:16px;height:16px;margin-left:6px;font-weight:400}
/* 标签页 */
.wrap{padding:64px 0 0 240px}
.tags{background:#fff;border-top:1px solid #f6f6f6;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:0 106px 0 10px;margin-bottom:10px;display:flex;align-items:center;position:relative;height:40px}
.tag{height:40px;line-height:40px;font-size:13px;color:#ccc;margin:0 3px;padding:0 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tag.on{color:#ee6a00;border-bottom-color:#ee6a00}
.tag i{font-style:normal;margin-left:6px;font-size:11px}
.tags .more{position:absolute;right:10px;top:6px}
/* 内容容器 */
.page-box{padding:0 20px 60px}
.inner{background:#fff;padding:20px;min-height:calc(100vh - 140px)}
.top-menu{height:53px;padding:0 0 20px;border-bottom:1px solid #E8E9ED;display:flex;position:relative;align-items:flex-start}
.top-menu .tl{display:flex;gap:15px}
.top-menu .tr{position:absolute;top:0;right:0;display:flex;gap:15px}
.topForm{padding-top:20px;display:flex;flex-wrap:wrap;gap:12px 0;align-items:center}
.fi{display:flex;align-items:center;margin-right:10px}
.fi label{width:130px;text-align:right;padding-right:12px;font-size:12px;color:#606266;flex-shrink:0}
/* ===== element 复刻 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:32px;padding:8px 15px;border-radius:4px;font-size:14px;cursor:pointer;border:1px solid transparent;user-select:none;white-space:nowrap;background:#fff}
.btn.pri{background:#ed6d00;border-color:#ed6d00;color:#fff}
.btn.pri:hover{background:#fa7b0c;border-color:#fa7b0c}
.btn.plain{background:#FDF6EC;border-color:#ed6d00;color:#ed6d00}
.btn.plain:hover{background:#ed6d00;color:#fff}
.btn.mini{height:26px;padding:4px 10px;font-size:12px}
.btn.dis{opacity:.5;cursor:not-allowed;pointer-events:none}
.tbtn{color:#ed6d00;cursor:pointer;font-size:13px;background:none;border:none;padding:0 4px;font-family:inherit}
.tbtn:hover{color:#fa7b0c}
.tbtn.dis{color:#D4D5D9;cursor:not-allowed;pointer-events:none}
.tbtn.dgr{color:#e7292e}
.inp{height:28px;border:1px solid #DCDFE6;border-radius:4px;padding:0 10px;font-size:12px;color:#606266;outline:none;width:160px;background:#fff;font-family:inherit}
.inp:focus{border-color:#ed6d00}
.inp::placeholder{color:#c0c4cc}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#c0c4cc 50%),linear-gradient(135deg,#c0c4cc 50%,transparent 50%);background-position:calc(100% - 15px) 12px,calc(100% - 10px) 12px;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
/* 表格 */
.tblw{margin-top:20px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:#f2f2f2;color:#333;font-weight:700;padding:10px 6px;text-align:center;border-bottom:1px solid #EBEEF5;font-size:13px;white-space:nowrap}
.tbl td{padding:10px 6px;text-align:center;border-bottom:1px solid #EBEEF5;color:#606266;font-size:13px}
.tbl tr:nth-child(even) td{background:#FAFAFA}
.tbl tr.gray td{color:#B9BCC2;background:#FBFBFB}
.tbl tr:hover td{background:#FDF6EC33}
/* 分页 */
.pg{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:20px;font-size:13px;color:#606266}
.pg .n{min-width:28px;height:28px;border-radius:3px;background:#f4f4f5;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.pg .n.on{background:#ed6d00;color:#fff}
/* tag 标签 */
.etag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;white-space:nowrap}
.t-ok{background:#f0f9eb;color:#67C23A;border:1px solid #e1f3d8}
.t-warn{background:#fdf6ec;color:#E6A23C;border:1px solid #faecd8}
.t-dgr{background:#fef0f0;color:#F56C6C;border:1px solid #fde2e2}
.t-info{background:#f4f4f5;color:#909399;border:1px solid #e9e9eb}
.t-orange{background:#FDF6EC;color:#ed6d00;border:1px solid #ed6d00}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.dlg{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.3);width:700px;max-width:94vw;max-height:80vh;display:flex;flex-direction:column}
.dlg .dh{padding:18px 20px 8px;font-size:17px;color:#303133;display:flex;justify-content:space-between}
.dlg .dh i{font-style:normal;color:#909399;cursor:pointer;font-size:15px}
.dlg .dh i:hover{color:#ed6d00}
.dlg .db{padding:10px 50px 10px 40px;overflow-y:auto}
.dlg .df{border-top:1px solid #EEF0F2;padding:14px 20px;display:flex;justify-content:flex-end;gap:15px}
.small-dlg{background:#fff;border-radius:4px;min-width:420px;max-width:540px;padding:20px 30px;text-align:center;font-size:16px;color:#333}
.small-dlg .ops{margin-top:22px;display:flex;justify-content:center;gap:15px}
/* switch */
.sw{width:40px;height:20px;border-radius:10px;background:#e7292e;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:#10CC8F}.sw.on::after{left:22px}
/* checkbox */
.cb{width:14px;height:14px;border:1px solid #DCDFE6;border-radius:2px;display:inline-block;vertical-align:-2px;margin-right:6px;cursor:pointer;background:#fff;position:relative}
.cb.on{background:#ed6d00;border-color:#ed6d00}
.cb.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
/* 改动标记 */
.mod{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:3px;background:#ed6d00;color:#fff;font-size:10px;font-weight:700;margin-left:6px;vertical-align:2px}
.mod.g{background:#1980ff}
/* 访客卡片流（复刻 visitor-card） */
.vs-list{display:flex;flex-wrap:wrap;margin-top:20px}
.visitor-card{position:relative;width:385px;min-height:280px;border:1px solid #ebeef5;border-radius:4px;background:#fff;box-shadow:0 2px 12px 0 rgba(0,0,0,.1);margin:0 10px 30px 0;padding:15px;cursor:pointer;color:#303133}
.vs-status{position:absolute;top:0;right:20px;width:70px;height:25px;color:#fff;font-size:12px;text-align:center;line-height:26px}
.vs-status::after{content:"";position:absolute;top:25px;left:0;border-top:8px solid;border-left:35px solid transparent!important;border-right:35px solid transparent!important;border-top-color:inherit}
.vs-info{display:flex;gap:12px;margin-top:10px;height:186px}
.vs-left{width:40%;height:170px;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;color:#c0c4cc;flex-direction:column;gap:6px;font-size:12px}
.vs-right{flex:1;font-size:13px;line-height:28px;overflow:hidden}
.vs-right p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-right .dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:#ed6d00;margin-right:8px;vertical-align:1px}
.vs-btm{border-top:1px dashed #E7EAF1;margin-top:8px;padding:11px 0 0;display:flex;font-size:12.5px;text-align:center}
.vs-btm>div{width:49%}
.vs-btm>div:first-child{border-right:1px solid #E7EAF1}
.notify{position:fixed;right:16px;top:80px;z-index:400;display:flex;flex-direction:column;gap:10px}
.ntc{background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.14);padding:14px 18px;min-width:280px;font-size:13px;color:#606266;border-left:4px solid #67C23A;animation:slin .3s}
.ntc.warn{border-left-color:#E6A23C}.ntc.err{border-left-color:#F56C6C}
.ntc b{display:block;color:#303133;font-size:15px;margin-bottom:2px}
@keyframes slin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.tip-orange{color:#ed6d00;font-size:16px;padding-bottom:10px;margin-bottom:20px;font-weight:600}
.ft-danger{color:#e7292e}
.gtip{color:#999;font-size:12px;line-height:2}
</style>
</head>

 ];

 var tabs=[['home','首页']], curPage='home', pageParam={};
 /** 将外部输入转为 HTML 文本和属性可安全使用的字符串。 */
 function escapeHtml(value){return String(value==null?'':value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
 function ntfy(t,m,tp){var d=document.createElement('div');d.className='ntc '+(tp||'');d.innerHTML='<b>'+t+'</b>'+m;document.getElementById('ntf').appendChild(d);setTimeout(function(){d.remove()},3200)}
 /** 打开页面并将当前调用的页面参数保存到对应页签。 */
 function openPage(id,name,param){
  if(id==='x'){ntfy('提示','该菜单不在本次改动范围，原型未包含','warn');return}
  pageParam=param||{};
  var tab=tabs.filter(function(t){return t[0]===id})[0];
  if(tab)tab[2]=pageParam;else tabs.push([id,name,pageParam]);
  curPage=id;draw();
 }
 /** 激活已有页签，并恢复该页签上次打开时的页面参数。 */
 function activateTab(id){var tab=tabs.filter(function(t){return t[0]===id})[0];if(!tab)return;pageParam=tab[2]||{};curPage=id;draw()}
 /** 关闭页签；若关闭当前页，则切换到最后一个保留页签。 */
 function closeTab(id,e){e.stopPropagation();tabs=tabs.filter(function(t){return t[0]!==id});if(curPage===id)activateTab(tabs[tabs.length-1][0]);else draw()}
 /**
  * 渲染左侧菜单与顶部页签，并保留页签关联的页面参数。
  * 读取本地菜单和页签状态，更新 DOM；不写入外部数据。
  */
 function drawShell(){
 var sb='';
 MENUS.forEach(function(m){
  sb+='<div class="msub'+(openG[m.g]?' open':'')+'" onclick="openG[\''+m.g+'\']=!openG[\''+m.g+'\'];draw()"><span>'+m.g+(m.nw?'<span class="newdot">新</span>':'')+'</span><span class="ar">▾</span></div>';
  sb+='<div class="mgrp'+(openG[m.g]?' open':'')+'">'+m.items.map(function(it){
    return '<div class="mi'+(curPage===it[0]?' on':'')+'" onclick="event.stopPropagation();openPage(\''+it[0]+'\',\''+it[1]+'\')">'+it[1]+(it[2]?'<span class="newdot"'+(it[2]==='改'?' style="background:#1980ff"':'')+'>'+it[2]+'</span>':'')+'</div>';
  }).join('')+'</div>';
 });
 document.getElementById('sb').innerHTML=sb;
 document.getElementById('tags').innerHTML=tabs.map(function(t){
  return '<span class="tag'+(curPage===t[0]?' on':'')+'" onclick="activateTab(\''+t[0]+'\')">'+t[1]+(t[0]!=='home'?'<i onclick="closeTab(\''+t[0]+'\',event)">✕</i>':'')+'</span>';
 }).join('')+'<span class="more"><span class="btn pri mini">更多 ▾</span></span>';
}

/** 模拟设备删除回执，并仅按目标对象更新或清理人员记录。 */
function startDel(persons){
 persons.forEach(function(person){person.del=1});draw();
 ntfy('成功','删除任务已下发，等待设备确认（约 3 秒演示回执）');
 setTimeout(function(){
  persons.forEach(function(person){person.del=(person.n==='陈晨')?2:3});
  var fail=persons.some(function(person){return person.del===2});
 authPersons=authPersons.filter(function(p){return persons.indexOf(p)<0||p.del!==3});
  draw();
  if(fail)ntfy('失败','陈晨 删除失败（东门禁2号机离线），已告警，可点「重发删除」','err');
  else ntfy('成功','设备已确认删除，系统记录已清除并归档留痕');
 },3000);
}
