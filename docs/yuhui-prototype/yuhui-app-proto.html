<!doctype html>
<meta charset="utf-8">
<title>裕慧家园 App 原型</title>
<style>
:root{--acc:#EC6C00;--acc2:#D95F00;--soft:#FFF1E3;--sink:#5A2600;--ink:#595757;--ink2:#6F6C6B;--ink3:#807D7C;
--line:#E5E3E3;--lsoft:#EFEEEE;--bg:#F7F7F7;--ok:#16A673;--warn:#C98416;--dgr:#D83B36;--info:#2376D9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#ECEDEA;font-family:"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;color:var(--ink);font-size:15px;line-height:1.7}
.stage{display:flex;gap:26px;justify-content:center;align-items:flex-start;padding:26px 16px 60px;flex-wrap:wrap}
.panel{width:300px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:sticky;top:26px}
.panel h3{margin:0 0 4px;font-size:15px}
.panel .sub{font-size:12px;color:var(--ink3);margin-bottom:12px}
.panel .lbl{font-size:12px;color:var(--ink2);font-weight:700;margin:12px 0 6px}
.acct{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--lsoft);border-radius:10px;margin-bottom:6px;cursor:pointer;font-size:13px}
.acct:hover{border-color:var(--acc)}
.acct.on{background:var(--soft);border-color:var(--acc);color:var(--sink);font-weight:700}
.acct small{color:var(--ink3);font-weight:400}
.hintbox{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.8}
.rst{display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:9px;border:1px solid var(--line);font-size:13px;font-weight:650;cursor:pointer;margin-top:12px;background:#fff}
.rst:hover{border-color:var(--dgr);color:var(--dgr)}
/* 手机壳 */
.shell{width:406px;flex-shrink:0}
.phone{width:406px;height:868px;background:#1c1c1c;border-radius:38px;padding:8px;box-shadow:0 30px 70px rgba(30,35,30,.28)}
.scr{width:390px;height:852px;background:var(--bg);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.bar{height:52px;background:#fff;border-bottom:1px solid var(--lsoft);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0}
.bar b{font-size:17px}
.bk{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:9px}
.bk:hover{background:var(--bg)}
.body{flex:1;overflow-y:auto;padding:14px 14px 18px;display:flex;flex-direction:column;gap:12px}
.foot{background:#fff;border-top:1px solid var(--lsoft);padding:12px 14px 16px;display:flex;gap:10px;flex-shrink:0}
.tabbar{height:58px;background:#fff;border-top:1px solid var(--lsoft);display:flex;flex-shrink:0}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink3);cursor:pointer}
.tabbar div.on{color:var(--acc);font-weight:700}
.card{background:#fff;border:1px solid var(--lsoft);border-radius:14px;padding:14px 15px}
.card.sel{border:1.5px solid var(--acc);background:#FFF9F2}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13.5px}
.kv s{color:var(--ink2);text-decoration:none;flex-shrink:0}
.kv b{font-weight:600;text-align:right}
.h4{font-size:14px;font-weight:750;margin:0 0 6px}
.btn{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;cursor:pointer;user-select:none;flex:1}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn.dgr{background:#fff;border:1px solid var(--dgr);color:var(--dgr)}
.btn.dis{background:#E5E3E3;color:#fff;cursor:not-allowed}
.btn.sm{min-height:38px;font-size:13px;flex:none;padding:0 16px}
.chip{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap}
.c-ok{background:rgba(22,166,115,.12);color:var(--ok)}.c-warn{background:rgba(201,132,22,.14);color:var(--warn)}
.c-dgr{background:rgba(216,59,54,.12);color:var(--dgr)}.c-info{background:rgba(35,118,217,.12);color:var(--info)}
.c-soft{background:var(--soft);color:var(--sink)}.c-gray{background:var(--bg);color:var(--ink3)}
.field{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 13px;display:flex;align-items:center;gap:8px;font-size:14px}
.field input,.field select,.field textarea{border:none;outline:none;flex:1;font-size:14px;font-family:inherit;background:transparent;color:var(--ink);min-width:0}
.field.foc{border:1.5px solid var(--acc);box-shadow:0 0 0 3px rgba(236,108,0,.16)}
.lab{font-size:12.5px;color:var(--ink2);margin:2px 0 -6px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px}
.seg div{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--ink2);border-radius:8px;cursor:pointer}
.seg div.on{background:#fff;border:1px solid var(--acc);color:var(--sink);font-weight:700}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt2 div{min-height:48px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14.5px;cursor:pointer;color:var(--ink2)}
.opt2 div.on{background:var(--soft);border-color:var(--acc);color:var(--sink);font-weight:700}
.gridfn{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fn{position:relative;background:#fff;border:1px solid var(--lsoft);border-radius:14px;padding:15px 13px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.fn:hover{border-color:var(--acc)}
.fn b{font-size:14.5px}
.fn .bdg{position:absolute;top:9px;right:11px;background:rgba(216,59,54,.12);color:var(--dgr);font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px}
.mono{font-family:ui-monospace,Menlo,monospace}
.muted{font-size:12px;color:var(--ink3)}
.sealtag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 11px;border-radius:8px;background:var(--bg);font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.sealtag i{font-style:normal;cursor:pointer;color:var(--ink3);font-weight:700}
.row{display:flex;gap:10px;align-items:center}
.avatar{width:52px;height:52px;border-radius:11px;background:var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:750;font-size:19px}
.banner{padding:11px 14px;display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;border-radius:12px}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:flex;gap:10px;font-size:12.5px;color:var(--ink2);position:relative;padding:0 0 14px 16px}
.tl .it:before{content:"";position:absolute;left:3px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.tl .it:after{content:"";position:absolute;left:6px;top:16px;bottom:0;width:1px;background:var(--lsoft)}
.tl .it:last-child:after{display:none}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(40,44,40,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:36px 0}
.nfc{width:120px;height:120px;border-radius:50%;background:var(--soft);margin:26px auto 4px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px dashed var(--acc)}
.nfc.done{border-style:solid;background:rgba(22,166,115,.10);border-color:var(--ok)}
@media(max-width:1080px){.panel{position:static;width:406px}}
</style>
<div class="stage">
  <div class="panel">
    <h3>演示控制台</h3>
    <div class="sub">这是右侧 App 的“上帝视角”：切换演示账号即可扮演流程中的不同角色，把一张放行单从申请一路走到归档。</div>
    <div class="lbl">演示账号（点击切换登录）</div>
    <div id="accts"></div>
    <div class="lbl">下一步引导</div>
    <div class="hintbox" id="hint">从「陈明（申请人）」开始：登录后进入「放行申请」提交一张新单。</div>
    <div class="rst" onclick="resetAll()">重置演示数据</div>
  </div>
  <div class="shell"><div class="phone"><div class="scr" id="scr"></div></div></div>
</div>
<script>
/* ================= 数据 ================= */
var POSTS=['保密区A-南门岗','保密区B-收发岗','成型车间B-收发室','研发打样室岗'];
var USERS=[
 {id:'chen',name:'陈明',badge:'YT06218',dept:'结构设计部',tag:'申请人',type:'apply',boss:'王志远'},
 {id:'wzy',name:'王志远',badge:'YT01022',dept:'结构设计部',tag:'直属主管',type:'manager'},
 {id:'ljj',name:'李建军',badge:'YT08211',dept:'安保部',tag:'A岗安检（出发）',type:'guard',post:'保密区A-南门岗'},
 {id:'zl',name:'赵磊',badge:'YT02890',dept:'安保部',tag:'B岗安检（到达）',type:'guard',post:'成型车间B-收发室'}
];
var ESCORTS={'8A02D14C':{name:'王强',dept:'工艺部',tag:'押运员',badge:'YT03150'}};
function seed(){return {
 orders:[
  {no:'MF20260829031',applicant:'吴凯',dept:'设备部',from:'保密区B-收发岗',to:'保密区A-南门岗',
   things:[{n:'笔记本电脑（研发专用）',c:'ZC-2026-0102',q:1}],seals:['F0779001','F0779002'],reason:'设备检修回送',
   status:'escorting',escort:{type:'lock',lockNo:'SD-0233'},
   tl:[['08-29 15:40','吴凯 提交申请'],['08-29 16:02','孙浩（主管）审批同意'],['08-29 16:52','B-收发岗 孙一鸣 确认出发 · 定位器锁 SD-0233']]},
  {no:'MF20260828011',applicant:'郑海',dept:'品质部',from:'保密区A-南门岗',to:'成型车间B-收发室',
   things:[{n:'手机中框对样件',c:'ZC-2026-0287',q:4}],seals:['F0768001'],reason:'品质对样',
   status:'archived',escort:{type:'man',name:'王强'},
   tl:[['08-28 09:20','郑海 提交申请'],['08-28 09:41','主管审批同意'],['08-28 10:15','A-南门岗 李建军 确认出发 · 押运 王强'],['08-28 10:52','成型车间B 赵磊 确认到达 · 归档']]}
 ],
 visitors:[
  {id:'v1',name:'李芳',comp:'深圳市恒兴印务有限公司',secret:true,valid:true,area:'新厂 · 保密区A',range:'08-28 09:00 ~ 08-30 18:00',host:'王强 · 工艺部',cause:'模具对样',inside:false},
  {id:'v2',name:'刘建国',comp:'宏图纸品',secret:true,valid:false,reason:'供应商保密协议已到期，权限已回收',area:'-',range:'-'}
 ],
 entries:[], seq:12
};}
var db=seed();
var me=null, post=null, stack=[], tab='home';
/* ================= 基础 ================= */
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/</g,'&lt;')}
function toast(m){var t=$('tst');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1800)}
function nav(s,p){stack.push({s:s,p:p||{}});render()}
function back(){if(stack.length>1)stack.pop();render()}
/**
 * 跳转到指定页面，并阻止安检人员在未选择岗位时进入工作台。
 * 参数为目标页面及其页面参数；仅更新本地演示导航状态，不产生外部副作用。
 */
function go(s,p){
 if(s==='home'&&me&&me.type==='guard'&&!post){toast('请先选择当前岗位');return}
 stack=[{s:s,p:p||{}}];render();
}
function cur(){return stack[stack.length-1]}
function stChip(o){
 var m={pending:['待审批','c-warn'],rejected:['已驳回','c-dgr'],approved:['待出发确认','c-warn'],escorting:['押运中','c-info'],archived:['已归档','c-ok']};
 var x=m[o.status];return '<span class="chip '+x[1]+'">'+x[0]+'</span>';
}
function now(){var d=new Date();function z(n){return (n<10?'0':'')+n}return z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())}
function newNo(){db.seq++;return 'MF202608300'+(db.seq<10?'0'+db.seq:db.seq)}
function counts(){
 return {
  approve: db.orders.filter(function(o){return o.status==='pending'}).length,
  todoA: db.orders.filter(function(o){return o.status==='approved'&&o.from===post}).length,
  todoB: db.orders.filter(function(o){return o.status==='escorting'&&o.to===post}).length
 };
}
function hint(){
 var h;
 var pend=db.orders.some(function(o){return o.status==='pending'});
 var appr=db.orders.some(function(o){return o.status==='approved'});
 var esc2=db.orders.some(function(o){return o.status==='escorting'&&o.to==='成型车间B-收发室'});
 if(!me) h='点击左侧账号登录 App。建议顺序：陈明 → 王志远 → 李建军 → 赵磊。';
 else if(me.type==='apply'&&!pend&&!appr) h='用「放行申请」提交一张新单（封条条码可点「模拟扫码」自动填入），然后切到 王志远 审批。';
 else if(pend) h='当前有待审批单：切换到「王志远（直属主管）」，进入放行审批 → 同意。';
 else if(appr) h='单据已审批：切换到「李建军（A岗安检）」，在放行待办里做出发确认（试试两种押运方式）。';
 else if(esc2) h='单据押运中：切换到「赵磊（B岗安检）」，用「封条扫码」输入任一封条号（如新单的 F08210xx）直接定位单据，确认到达归档。';
 else h='流程已走完：可在「记录报表」查全程轨迹；也可以体验访客核验/进出登记，或点「重置演示数据」重来。';
 $('hint').textContent=h;
}
function renderAccts(){
 $('accts').innerHTML=USERS.map(function(u){
  return '<div class="acct'+(me&&me.id===u.id?' on':'')+'" onclick="loginAs(\''+u.id+'\')"><span style="width:30px;height:30px;border-radius:8px;background:'+(me&&me.id===u.id?'var(--acc)':'#c9cec9')+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:750;font-size:13px">'+u.name[0]+'</span><span>'+u.name+'<br><small>'+u.tag+'</small></span></div>';
 }).join('');
}
function loginAs(id){
 me=USERS.filter(function(u){return u.id===id})[0];
 post=me.post||null;
 if(me.type==='guard'){stack=[{s:'postSel',p:{}}];}
 else {stack=[{s:'home',p:{}}];}
 tab='home';render();
}
function logout(){me=null;post=null;stack=[{s:'login',p:{}}];render()}
/**
 * 还原演示数据与全部临时流程状态，避免上一次演示的缓存影响下一次流程。
 * 无输入和返回值；会重建本地数据、清空会话状态并重新渲染界面。
 */
function resetAll(){
 db=seed();draft=null;aSel={};bCard={};todoTab='a';repF={seal:'',who:''};
 me=null;post=null;tab='home';stack=[{s:'login',p:{}}];render();
}
/* ================= 界面 ================= */
function bar(t,showBack){return '<div class="bar">'+(showBack?'<div class="bk" onclick="back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#595757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></div>':'<span style="width:34px"></span>')+'<b>'+t+'</b><span style="width:34px"></span></div>'}
function tabbarHtml(){
 return '<div class="tabbar"><div class="'+(tab==='home'?'on':'')+'" onclick="tab=\'home\';go(\'home\')"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5h-5v5H4z"></path></svg>首页</div><div class="'+(tab==='mine'?'on':'')+'" onclick="tab=\'mine\';go(\'mine\')"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8.5" r="3.4"></circle><path d="M4.5 20c1-3.4 4-5.2 7.5-5.2s6.5 1.8 7.5 5.2"></path></svg>我的</div></div>';
}
var V={};
/* ---- 登录 ---- */
V.login=function(){
 return '<div class="body" style="justify-content:center;background:#fff;gap:26px;padding:0 26px">'
 +'<div><div style="display:inline-block;background:var(--acc);color:#fff;font-weight:800;font-size:20px;letter-spacing:.28em;padding:6px 14px 6px 18px;border-radius:8px">YUTO</div>'
 +'<div style="font-size:27px;font-weight:750;margin-top:14px">裕慧家园</div></div>'
 +'<div style="display:flex;flex-direction:column;gap:12px">'
 +'<div class="lab">工号</div><div class="field"><input id="lg-b" placeholder="请输入工号" value="'+(me?me.badge:'')+'"></div>'
 +'<div class="lab">密码</div><div class="field"><input type="password" value="12345678"></div>'

 +'<div class="muted" style="text-align:center">许昌裕同印刷包装有限公司</div></div>';

function doLogin(){var b=$('lg-b').value.trim();var u=USERS.filter(function(x){return x.badge===b})[0]||USERS[0];loginAs(u.id)}
/* ---- 岗位选择 ---- */
V.postSel=function(){
 return bar('选择当前岗位')+'<div class="body">'
 +'<div class="muted">入口：登录后必选；之后可在首页顶部岗位标签随时切换。岗位随每条登记/确认记录留痕。</div>'
 +POSTS.map(function(p){return '<div class="card'+(p===post?' sel':'')+'" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="post=\''+p+'\';render()"><b>'+p+'</b>'+(p===post?'<span class="chip c-soft">当前</span>':'')+'</div>'}).join('')
 +'</div><div class="foot"><div class="btn" onclick="go(\'home\')">进入工作台</div></div>';
};
/* ---- 首页 ---- */
V.home=function(){
 var c=counts();
 var fns=[];
 function fn(icon,name,scr,bdg){fns.push('<div class="fn" onclick="nav(\''+scr+'\')"><span style="color:var(--ink2)">'+icon+'</span><b>'+name+'</b>'+(bdg?'<span class="bdg">'+bdg+'</span>':'')+'</div>')}
 var I={scan:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3"></path><path d="M16 4h3a1 1 0 0 1 1 1v3"></path><path d="M20 16v3a1 1 0 0 1-1 1h-3"></path><path d="M8 20H5a1 1 0 0 1-1-1v-3"></path><line x1="4" y1="12" x2="20" y2="12"></line></svg>',
 vis:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19c.8-3 3-4.5 5.5-4.5S13.7 16 14.5 19"></path><polyline points="16 10 18 12 21.5 8.5"></polyline></svg>',

  * 无显式参数，读取扫码输入框；只会更新本地页面导航，找不到或无权限时提示并返回。

 function sealGo(){
 var v=$('sc-in').value.trim();if(!v){toast('请扫描或输入封条编号');return}
 var o=db.orders.filter(function(x){return x.seals.indexOf(v)>=0})[0];
