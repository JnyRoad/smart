    <script>
      ;(function flexible(window, document) {
        var baseWidth = 375
        var basefontsize = 100
        var docEl = document.documentElement
        var dpr = window.devicePixelRatio || 1

        // adjust body font size
        function setBodyFontSize() {
          if (document.body) {
            //document.body.style.fontSize = (12 * dpr) + 'px'
          } else {
            document.addEventListener('DOMContentLoaded', setBodyFontSize)
          }
        }

        setBodyFontSize()

        // set 1rem = viewWidth / 10
        function setRemUnit() {
          // var rem = docEl.clientWidth / 10
          // docEl.style.fontSize = rem + 'px'
          // alert(document.documentElement.clientWidth);
          // alert(window.devicePixelRatio);
          var rem = 100 / (baseWidth / document.documentElement.clientWidth)
          // alert(rem);
          docEl.style.fontSize = rem + 'px'
        }

        setRemUnit()

        // reset rem unit on page resize
        window.addEventListener('resize', setRemUnit)
        window.addEventListener('pageshow', function(e) {
          if (e.persisted) {
            setRemUnit()
          }
        })

        // detect 0.5px supports
        if (dpr >= 2) {
          var fakeBody = document.createElement('body')
          var testElement = document.createElement('div')
          testElement.style.border = '.5px solid transparent'
          fakeBody.appendChild(testElement)
          docEl.appendChild(fakeBody)
          if (testElement.offsetHeight === 1) {
            docEl.classList.add('hairlines')
          }
          docEl.removeChild(fakeBody)
        }
      })(window, document)
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .tce-vectoring {
        position: fixed;
        width: 100%;
        height: 100%;
        min-height: 600px;
        background: rgba(0, 0, 0, 0.2);
        /* background-image: -webkit-linear-gradient(#ddd, #eee);

        background-image: linear-gradient(#ddd, #eee); */
        color: #fff;
        text-align: center;
        font-size: 14px;
        animation: vectoring 3s infinite;
        line-height: 2;
      }
      .tce-vectoring a {
        color: #fff;
        font-size: 14px;
        text-decoration: none;
      }
      .tce-vectoring-logo {
        position: fixed;
        opacity: 0.8;
        top: 10px;
        left: 10px;
      }
      .tce-vectoring__inner {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 200px;
        height: 80px;
        margin-left: -100px;
        margin-top: -40px;
      }
      .avue-vectoring__footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
      }
      @keyframes vectoring {
        0% {
          background-color: rgba(0, 0, 0, 0.4);
        }
        50% {
          background-color: rgba(0, 0, 0, 0.7);
        }
        100% {
          background-color: rgba(0, 0, 0, 0.4);
        }
      }
    </style>
