schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Smart Spec Planning"
  version: "1.1.0"
  author: "Smart"
  description: "Runs specify → plan → tasks → analyze with review gates; implementation is handed to superpowers"

requires:
  # auto 集成解析需要此版本；兼容列表是提示，不限制其他已提供核心命令的集成。
  speckit_version: ">=0.8.5"
  integrations:
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use (e.g. claude, copilot, gemini; 'auto' uses the project's initialized integration)"
steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}；验证标准见 docs/agent-rules/development.md#验证。"

  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: handoff-superpowers
    type: gate
    message: "Review the analysis, then hand implementation to superpowers."
    options: [approve, reject]
    on_reject: abort
