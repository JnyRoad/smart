# 数据源配置
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: oracle.jdbc.driver.OracleDriver
    username: app
    password: ${SMART_APP_DATASOURCE_PASSWORD:}
    url: jdbc:oracle:thin:@smart-oracle:1521:orcl
  #    password: ${SMART_APP_LEGACY_DATASOURCE_PASSWORD:}
  #    url: jdbc:oracle:thin:@plmdb.szyuto.com:1521:ev6db
  main:
    allow-bean-definition-overriding: true
  sms:
    url: http://10.0.20.97:81/SOS.WebFramework/SMSBll/SendSMS
    systemName: 会馆系统
    remarks: 会馆系统
    token: ${SMART_APP_SMS_TOKEN:}      #token
  oa:
    staff:
      query-url: http://bgserver.szyuto.com/SOS.OA/ADABll/GetUserInfoByWorkCode
      query-token: ${SMART_APP_OA_QUERY_TOKEN:}      #token
  #邮箱配置
