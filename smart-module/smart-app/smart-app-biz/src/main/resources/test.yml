    host: mail.szyuto.com
    username: ${SMART_APP_MAIL_USERNAME:}
    password: ${SMART_APP_MAIL_PASSWORD:}
    default-encoding: utf-8
    port: 25
  yuto-secsytem:
    phone:
      update-url: http://10.0.20.97:81/SOS.WebFramework/Base_UserBll/RevisePhone
  # Ocr服务
  ocr:
    username: test
    url: http://10.20.20.136:8888/cxfServerX/doAllCardRecon
  wechat:
    oauth2:  https://api.weixin.qq.com/sns/oauth2/access_token?appid=APPID&secret=SECRET&code=CODE&grant_type=authorization_code
    appId: wx1e6f3e53591dde8f
    appSecret: ${SMART_APP_WECHAT_APP_SECRET:}
    #人脸比对阈值
  face:
    compare-value: 0.55
