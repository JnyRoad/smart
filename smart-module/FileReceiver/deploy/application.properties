# =====================================================================
# FileReceiver 部署配置（外置配置，随发布包提供）
#
# 使用方式：本文件与 file.jar 放在同一目录，启动命令必须在该目录下执行
# （例如 cd /d D:\FileReceiver && java -jar file.jar），
# 否则 Spring Boot 不会加载本文件、只会用 jar 内默认值（拉取默认关闭）。
# =====================================================================

# HTTP 端口（旧推送接口 /file/upload 使用；与现场其他程序冲突时可修改）
server.port=18080

# ---------------- 拉取模式（主链路） ----------------
# 是否启用拉取任务。启用后下面三项必填，缺任何一项程序会拒绝启动，
# 并在日志（软件目录 Logs\ 下）点名缺失的配置键
file-receiver.pull.enabled=true

# 生产网关地址，例如 http://10.x.x.x:9990（/auth、/platform 为网关路由前缀）——部署时必填
file-receiver.pull.server-url=

# OAuth2 client_credentials 凭证：app-id 固定为 file-receiver-xc
file-receiver.pull.app-id=file-receiver-xc

# app-secret 为 smart-ui「应用管理」对 file-receiver-xc 重置 App Secret 时
# 弹窗展示的明文（只展示一次）——部署时必填。
# 密钥只填在这台机器的本文件里，禁止提交代码库、禁止走明文邮件/IM 传递
file-receiver.pull.app-secret=

# 拉取轮询间隔（秒）
file-receiver.pull.interval-seconds=30

# ---------------- 本地目录 ----------------
# 照片落盘目录：与打印页面 b-PAC 硬约定一致，不可修改
file-receiver.photo-dir=D:/visitor

# 旧推送接口 /file/upload 的保存根目录：过渡期（服务端推送开关未关闭前）
# 推送兜底的照片也落到 D:/visitor；推送整体退役后本项可删
file-receiver.upload-root=D:/visitor

# ---------------- 清理 ----------------
# 本地照片保留天数，超期且不在待处理清单中的照片每日 03:00 清理；0 表示关闭清理
file-receiver.cleanup.retention-days=7

# ---------------- 日志 ----------------
# 日志默认写在 file.jar 所在目录的 Logs\ 下，按天一个文件（保留 30 天/总量 1GB），无需配置；
# 如需改位置：设置环境变量 FILE_RECEIVER_LOG_DIR，或启动参数 java -DLOG_DIR=<目录> -jar file.jar
