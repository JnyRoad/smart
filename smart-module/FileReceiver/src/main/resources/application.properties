server.port=18080

# 旧推送模式（已废弃，将在下个版本移除）
file-receiver.upload-root=${FILE_RECEIVER_UPLOAD_ROOT:${java.io.tmpdir}/file-receiver}

# 拉取模式：是否启用、网关地址、client_credentials 的 app-id/app-secret、轮询间隔（秒，默认 30）
file-receiver.pull.enabled=${FILE_RECEIVER_PULL_ENABLED:false}
file-receiver.pull.server-url=${FILE_RECEIVER_PULL_SERVER_URL:}
file-receiver.pull.app-id=${FILE_RECEIVER_PULL_APP_ID:}
file-receiver.pull.app-secret=${FILE_RECEIVER_PULL_APP_SECRET:}
file-receiver.pull.interval-seconds=${FILE_RECEIVER_PULL_INTERVAL_SECONDS:30}

# 本地照片存放目录，默认许昌打印机 Windows 机部署路径
file-receiver.photo-dir=${FILE_RECEIVER_PHOTO_DIR:D:/visitor}

# 过期清理：保留天数，0 表示关闭清理任务
file-receiver.cleanup.retention-days=${FILE_RECEIVER_CLEANUP_RETENTION_DAYS:7}
