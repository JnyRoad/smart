name: yuto-smart-dev

services:
  smart-nacos:
    image: nacos/nacos-server:v1.4.6
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: ${NACOS_JVM_XMS:-256m}
      JVM_XMX: ${NACOS_JVM_XMX:-512m}
      JVM_XMN: ${NACOS_JVM_XMN:-128m}
    ports:
      - "${NACOS_HOST_PORT:-8848}:8848"
    volumes:
      - smart-nacos-data:/home/nacos/data
      - smart-nacos-logs:/home/nacos/logs
    networks:
      - smart-dev

  smart-nacos-init:
    image: curlimages/curl:8.8.0
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-nacos-init
    depends_on:
      smart-nacos:
        condition: service_started
    environment:
      NACOS_SERVER: http://smart-nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-eda914a9-b100-427b-9d37-4d7da89b841f}
      NACOS_NAMESPACE_NAME: ${NACOS_NAMESPACE_NAME:-smart-local-dev}
      NACOS_GROUP: ${NACOS_GROUP:-dev}
      NACOS_CONFIG_DIR: /nacos-config/dev
    volumes:
      - ./docker/nacos/config:/nacos-config:ro
      - ./docker/nacos/init-nacos.sh:/init-nacos.sh:ro
    entrypoint: ["/bin/sh", "/init-nacos.sh"]
    networks:
      - smart-dev

  smart-redis:
    image: redis:7-alpine
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-redis
    ports:
      - "${SMART_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - smart-redis-data:/data
    networks:
      - smart-dev

  smart-oracle:
    image: gvenzl/oracle-xe:21-slim
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-oracle
    profiles: ["backend", "local-db", "bridge", "bridge-isc"]
    environment:
      ORACLE_PASSWORD: ${SMART_ORACLE_SYS_PASSWORD:-smart_sys_123}
      APP_USER: ${SMART_DB_USERNAME:-SMART}
      APP_USER_PASSWORD: ${SMART_DB_PASSWORD:-smart_local_123}
    ports:
      - "${SMART_ORACLE_HOST_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    volumes:
      - smart-oracle-data:/opt/oracle/oradata
    networks:
      - smart-dev

  smart-mock-http:
    image: mockserver/mockserver:5.15.0
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-mock-http
    profiles: ["bridge", "bridge-isc", "mock"]
    environment:
      MOCKSERVER_LOG_LEVEL: WARN
    ports:
      - "${SMART_MOCK_HTTP_HOST_PORT:-1080}:1080"
    networks:
      - smart-dev

  smart-zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-zookeeper
    profiles: ["backend", "bridge", "bridge-isc", "bridge-concentrator", "local-kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: ${SMART_ZOOKEEPER_HEAP_OPTS:--Xms64m -Xmx256m}
    ports:
      - "${SMART_ZOOKEEPER_HOST_PORT:-2181}:2181"
    volumes:
      - smart-zookeeper-data:/var/lib/zookeeper/data
      - smart-zookeeper-log:/var/lib/zookeeper/log
    networks:
      - smart-dev

  smart-kafka:
    image: confluentinc/cp-kafka:7.7.1
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-kafka
    profiles: ["backend", "bridge", "bridge-isc", "bridge-concentrator", "local-kafka"]
    depends_on:
      smart-zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: smart-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://smart-kafka:9092,PLAINTEXT_HOST://localhost:${SMART_KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${SMART_KAFKA_HEAP_OPTS:--Xms128m -Xmx512m}
    ports:
      - "${SMART_KAFKA_HOST_PORT:-9092}:29092"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - smart-kafka-data:/var/lib/kafka/data
    networks:
      - smart-dev

  smart-gateway:
    build:
      context: ./smart
      dockerfile: smart-gateway/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-gateway:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-gateway
    profiles: ["backend", "frontend"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-redis:
        condition: service_started
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: &backend-env
      APP_ENV: ${APP_ENV:-local}
      NACOS_URL: smart-nacos
      NACOS_PORT: 8848
      NACOS_GROUP: ${NACOS_GROUP:-dev}
      JAVA_TOOL_OPTIONS: ${SMART_JAVA_TOOL_OPTIONS:--Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m}
      TZ: Asia/Shanghai
    ports:
      - "${SMART_GATEWAY_HOST_PORT:-9990}:9990"
    volumes:
      - smart-logs:/smart-gateway/logs
    networks:
      - smart-dev

  smart-auth:
    build:
      context: ./smart
      dockerfile: smart-auth/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-auth:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-auth
    profiles: ["backend"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-redis:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_AUTH_HOST_PORT:-3000}:3000"
    volumes:
      - smart-logs:/smart-auth/logs
    networks:
      - smart-dev

  smart-upms:
    build:
      context: ./smart
      dockerfile: smart-upms/smart-upms-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-upms-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-upms
    profiles: ["backend"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-redis:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_UPMS_HOST_PORT:-4000}:4000"
    volumes:
      - smart-logs:/smart-upms/logs
    networks:
      - smart-dev

  smart-platform:
    build:
      context: ./smart-module
      dockerfile: smart-platform/smart-platform-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-platform-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-platform
    profiles: ["backend", "bridge", "bridge-isc"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-redis:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_PLATFORM_HOST_PORT:-6030}:6030"
    volumes:
      - smart-logs:/smart-platform/logs
    networks:
      - smart-dev

  smart-app:
    build:
      context: ./smart-module
      dockerfile: smart-app/smart-app-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-app-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-app
    profiles: ["backend"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-redis:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_APP_HOST_PORT:-6020}:6020"
    volumes:
      - smart-logs:/smart-app/logs
    networks:
      - smart-dev

  smart-algorithm:
    build:
      context: ./smart-module
      dockerfile: smart-algorithm/smart-algorithm-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-algorithm-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-algorithm
    profiles: ["backend"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-redis:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_ALGORITHM_HOST_PORT:-8990}:8990"
    volumes:
      - smart-logs:/smart-algorithm/logs
    networks:
      - smart-dev

  smart-data:
    build:
      context: ./smart-module
      dockerfile: smart-data/smart-data-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-data-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-data
    profiles: ["backend"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-redis:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_DATA_HOST_PORT:-6063}:6060"
    volumes:
      - smart-logs:/smart-data/logs
    networks:
      - smart-dev

  smart-dispatcher:
    build:
      context: ./smart-module
      dockerfile: smart-dispatcher/smart-dispatcher-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-dispatcher-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-dispatcher
    profiles: ["backend", "bridge", "bridge-isc"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-platform:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_DISPATCHER_HOST_PORT:-8082}:8082"
    volumes:
      - smart-logs:/smart-dispatcher/logs
    networks:
      - smart-dev

  smart-push:
    build:
      context: ./smart-module
      dockerfile: smart-push/smart-push-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-push-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-push
    profiles: ["backend"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-redis:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_PUSH_HOST_PORT:-6090}:6090"
    volumes:
      - smart-logs:/smart-push/logs
    networks:
      - smart-dev

  smart-bridge:
    build:
      context: ./smart-module
      dockerfile: smart-bridge/smart-bridge-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-bridge-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-bridge
    profiles: ["bridge"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-dispatcher:
        condition: service_started
      smart-kafka:
        condition: service_healthy
      smart-mock-http:
        condition: service_started
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_BRIDGE_HOST_PORT:-6061}:6060"
    volumes:
      - smart-logs:/smart-bridge/logs
      - smart-bridge-db:/smart-bridge/database
    networks:
      - smart-dev

  smart-bridge-isc:
    build:
      context: ./smart-module
      dockerfile: smart-bridge-isc/smart-bridge-isc-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-bridge-isc-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-bridge-isc
    profiles: ["bridge-isc"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-dispatcher:
        condition: service_started
      smart-kafka:
        condition: service_healthy
      smart-mock-http:
        condition: service_started
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_BRIDGE_ISC_HOST_PORT:-6060}:6060"
    volumes:
      - smart-logs:/smart-bridge-isc/logs
      - smart-bridge-isc-db:/smart-bridge-isc/database
    networks:
      - smart-dev

  smart-bridge-concentrator:
    build:
      context: ./smart-module
      dockerfile: smart-bridge-concentrator/smart-bridge-concentrator-biz/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-bridge-concentrator-biz:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-bridge-concentrator
    profiles: ["bridge-concentrator"]
    depends_on:
      smart-kafka:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SMART_KAFKA_BOOTSTRAP_SERVERS:-smart-kafka:9092}
      SMART_KAFKA_BRIDGE_EVENT_TOPIC: ${SMART_KAFKA_BRIDGE_EVENT_TOPIC:-smart-local-bridge-event}
      JAVA_TOOL_OPTIONS: ${SMART_JAVA_TOOL_OPTIONS:--Xms96m -Xmx384m -XX:MaxMetaspaceSize=192m}
      TZ: Asia/Shanghai
    ports:
      - "${SMART_BRIDGE_CONCENTRATOR_HOST_PORT:-6062}:6062"
      - "${SMART_BRIDGE_CONCENTRATOR_NETTY_HOST_PORT:-6001}:6001"
    volumes:
      - smart-logs:/smart-bridge-concentrator/logs
    networks:
      - smart-dev

  smart-schedule:
    build:
      context: ./smart-module
      dockerfile: smart-schedule/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: smart/smart-schedule:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-schedule
    profiles: ["backend"]
    depends_on:
      smart-nacos-init:
        condition: service_completed_successfully
      smart-dispatcher:
        condition: service_started
      smart-oracle:
        condition: service_healthy
    env_file: ${SMART_DOCKER_ENV_FILE:-.env.local}
    environment: *backend-env
    ports:
      - "${SMART_SCHEDULE_HOST_PORT:-7070}:7070"
    volumes:
      - smart-logs:/smart-schedule/logs
    networks:
      - smart-dev

  smart-ui:
    build:
      context: ./smart-ui
      dockerfile: Dockerfile
      args:
        VUE_APP_PLATFORM_URL: ${VUE_APP_PLATFORM_URL:-http://smart-gateway:9990}
        VUE_APP_BASE_URL: ${VUE_APP_BASE_URL:-http://smart-gateway:9990}
        VUE_APP_SECURITY_ENCODE_KEY: ${VUE_APP_SECURITY_ENCODE_KEY:-}
    image: smart/smart-ui:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-ui
    profiles: ["frontend"]
    depends_on:
      smart-gateway:
        condition: service_started
    ports:
      - "${SMART_UI_HOST_PORT:-8080}:80"
    networks:
      - smart-dev

  smart-h5:
    build:
      context: ./smart-h5
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: ${SMART_H5_API_PROXY_TARGET:-http://smart-gateway:9990}
    image: smart/smart-h5:dev
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: smart-h5
    profiles: ["frontend"]
    depends_on:
      smart-gateway:
        condition: service_started
    ports:
      - "${SMART_H5_HOST_PORT:-8081}:3000"
    networks:
      - smart-dev

networks:
  smart-dev:
    name: smart-dev

volumes:
  smart-nacos-data:
  smart-nacos-logs:
  smart-redis-data:
  smart-oracle-data:
  smart-zookeeper-data:
  smart-zookeeper-log:
  smart-kafka-data:
  smart-bridge-db:
  smart-bridge-isc-db:
  smart-logs:
