## spring security 配置
security:
  oauth2:
    client:
      client-id: "${SMART_UPMS_OAUTH_CLIENT_ID:${SMART_OAUTH_CLIENT_ID:}}"        # smart
      client-secret: "${SMART_UPMS_OAUTH_CLIENT_SECRET:${SMART_OAUTH_CLIENT_SECRET:}}"    # smart
      scope: server
      # 默认放行url,子模块重写时application-dev.yml中的公共配置会被覆盖,所以要把公共配置中的放行url再写一次
      #      ignore-urls:
      #        - /**
      ignore-urls:
        - /actuator/**
        - /v2/api-docs
        - /user/info/*
        - /user/query/*
        - /user/verify/*
        - /user/delete/*
        - /user/simple
        - /user/social/simple
        - /user/password/update/**
        - /user/park/list/**
        - /social/info/*
        - /mobile/*
        - /log/save
        - /dict/id
        - /dict/value
        - /dict/type
        - /dict/save
        - /movetask/list
        - /user/edit
        - /api/**

# 数据源
spring:
  datasource:
    type: "${SMART_UPMS_DB_TYPE:com.zaxxer.hikari.HikariDataSource}"
    driver-class-name: "${SMART_UPMS_DB_DRIVER:oracle.jdbc.driver.OracleDriver}"
    username: "${SMART_UPMS_DB_USERNAME:${SMART_DB_USERNAME:}}"
    password: "${SMART_UPMS_DB_PASSWORD:${SMART_DB_PASSWORD:}}"
    url: "${SMART_UPMS_DB_URL:${SMART_DB_URL:}}"
  yuto-secsytem:
    login:
      #sign-on: http://10.0.20.97:81/SOS.WebFramework/LoginBll/GetUserAuthority
      sign-on: "${SMART_SECSYSTEM_LOGIN_SIGN_ON:}"
      sign-token: "${SMART_SECSYSTEM_LOGIN_SIGN_TOKEN:}"
    password:
      #update-url: http://10.0.20.97:81/SOS.WebFramework/Base_UserBll/RevisePassword
      update-url: "${SMART_SECSYSTEM_PASSWORD_UPDATE_URL:}"
      update-token: "${SMART_SECSYSTEM_PASSWORD_UPDATE_TOKEN:}"

# Logger Config
logging:
  level:
    com.tce.smart.admin.mapper: debug

# 是否测试环境 true：是 false：否
# 测试环境将关闭裕同系统的登陆流程
# 正式环境请设置为false
env:
  test: false
