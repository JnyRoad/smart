    #jdbc-url: jdbc:oracle:thin:@smart-oracle:1521:ev6db

task:
  ehr:
    wageSignTaskTime: 0 10 0 1 * ?             #每月一日零点十分执行工资签单员工信息生成任务
    noticeTaskTime: 0 0 10 * * ?               #每天十点执行，工资签收提醒与考勤汇总确认提醒任务
    emailPush: 0 0 10 * * ?                    #每天十点执行，访客记录推送任务
    dealyQuit: 0 0 23 * * ?                    #每天23点执行，退宿申请延迟退宿
  meter:
    checkOnline: 0 0/5 * * * ? #定时查询设备连接状态
    water:
      reading: 0 */59 * * * ? #定时查询水表读数  0 0 0/8 * * ? 修正
    ele:
      reading: 0 */59 * * * ? #定时查询电表读数  
    day: 
      calc: 0 0 2 * * ? #许昌水电定时结算任务

