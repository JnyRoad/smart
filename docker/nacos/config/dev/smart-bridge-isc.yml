security:
  # ISC Bridge 向 Dispatcher 回传事件仅使用独立服务令牌；缺失即拒绝调用。
  inner:
    service-token:
      client-id: "${SMART_BRIDGE_ISC_OAUTH_CLIENT_ID:}"
      client-secret: "${SMART_BRIDGE_ISC_OAUTH_CLIENT_SECRET:}"
      access-token-uri: "${SMART_BRIDGE_ISC_OAUTH_TOKEN_URI:}"
    # Dispatcher 调用 ISC Bridge 必须在部署时显式列入精确 client_id 白名单；空值拒绝全部调用。
    bridge:
      allowed-client-ids: "${SMART_BRIDGE_ISC_ALLOWED_CLIENT_IDS:}"
  oauth2:
    client:
      client-id: "${SMART_BRIDGE_ISC_OAUTH_CLIENT_ID:}"        # bridge
      client-secret: "${SMART_BRIDGE_ISC_OAUTH_CLIENT_SECRET:}"    # bridge
      scope: server
      # 放行url
      ignore-urls: []

smart:
  image:
    expire: 90                                            # 园区图片失效时间（天）, 系统初始化创建hbase表的时候生效
  hik:
    host: "${SMART_HIK_HOST_ISC:${SMART_HIK_HOST:}}"
    app-key: "${SMART_HIK_APP_KEY_ISC:${SMART_HIK_APP_KEY:}}"
    app-secret: "${SMART_HIK_APP_SECRET_ISC:${SMART_HIK_APP_SECRET:}}"
    callback-url: "${SMART_HIK_CALLBACK_URL_ISC:${SMART_HIK_CALLBACK_URL:}}"
    # 旧回调未提供可验证签名、时间窗或 nonce；完成厂商协议改造前禁止重新订阅。
    event-subscribe-enabled: "${SMART_HIK_EVENT_SUBSCRIBE_ENABLED_ISC:false}"
    # callback-url: http://10.1.20.110:6089/bridge/handle

hbase:
  zookeeper:
    znode: "${SMART_HBASE_ZOOKEEPER_ZNODE:/hbase}"
    #192.168.2.214,192.168.2.210,192.168.2.211
    port: "${SMART_HBASE_ZOOKEEPER_PORT:2181}"
    quorum: "${SMART_HBASE_ZOOKEEPER_QUORUM:smart-hbase}"
