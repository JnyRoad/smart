security:
  oauth2:
    client:
      client-id: "${SMART_DATA_OAUTH_CLIENT_ID:${SMART_OAUTH_CLIENT_ID:}}"
      client-secret: "${SMART_DATA_OAUTH_CLIENT_SECRET:${SMART_OAUTH_CLIENT_SECRET:}}"
      scope: server
      ignore-urls:
      - "/**"
spring:
  datasource:
    type: "${SMART_DATA_DB_TYPE:com.alibaba.druid.pool.DruidDataSource}"
    driver-class-name: "${SMART_DATA_DB_DRIVER:oracle.jdbc.driver.OracleDriver}"
    username: "${SMART_DATA_DB_USERNAME:${SMART_DB_USERNAME:}}"
    password: "${SMART_DATA_DB_PASSWORD:${SMART_DB_PASSWORD:}}"
    jdbc-url: "${SMART_DATA_DB_URL:${SMART_DB_URL:}}"
    stat-view-servlet:
      url-pattern: "/druid/*"
      allow: 127.0.0.1
      reset-enable: false
      login-username: "${SMART_DATA_DB_DRUID_LOGIN_USERNAME:}"
      login-password: "${SMART_DATA_DB_DRUID_LOGIN_PASSWORD:}"
      enabled: false
  main:
    allow-bean-definition-overriding: true
  sms:
    url: "${SMART_SMS_URL:}"
    systemName: 智慧系统
    remarks: 智慧系统
    token: "${SMART_SMS_TOKEN:}"
  oa:
    staff:
      query-url: "${SMART_OA_STAFF_QUERY_URL:}"
      query-token: "${SMART_OA_STAFF_QUERY_TOKEN:}"
  mail:
    host: "${SMART_MAIL_HOST:}"
    username: "${SMART_MAIL_USERNAME:}"
    password: "${SMART_MAIL_PASSWORD:}"
    default-encoding: utf-8
    port: 25
