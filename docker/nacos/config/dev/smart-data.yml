    driver-class-name: "${SMART_EHRVIEW_DB_DRIVER_DATA:${SMART_EHRVIEW_DB_DRIVER:oracle.jdbc.driver.OracleDriver}}"
    username: "${SMART_EHRVIEW_DB_USERNAME_DATA:${SMART_EHRVIEW_DB_USERNAME:}}"
    password: "${SMART_EHRVIEW_DB_PASSWORD_DATA:${SMART_EHRVIEW_DB_PASSWORD:}}"
    jdbc-url: "${SMART_EHRVIEW_DB_URL_DATA:${SMART_EHRVIEW_DB_URL:}}"
    stat-view-servlet:
      url-pattern: /druid/*
      # IP 白名单，没有配置或者为空，则允许所有访问
      allow: 127.0.0.1
      # 禁用 HTML 中 Reset All 按钮
      reset-enable: false
      # 登录用户名/密码
      login-username: "${SMART_EHRVIEW_DB_DRUID_LOGIN_USERNAME:}"
      login-password: "${SMART_EHRVIEW_DB_DRUID_LOGIN_PASSWORD:}"
      # 需要设置enabled=true,否则会报出There was an unexpected error (type=Not Found, status=404).错误，或者将druid-spring-boot-starter的版本降低到1.1.10及以下
      # 是否启用StatViewServlet（监控页面）默认值为false（考虑到安全问题默认并未启动，如需启用建议设置密码或白名单以保障安全）
      enabled: false

