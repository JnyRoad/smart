spring:
  # C6-刷卡消费数据源，默认数据源
  datasource:
    type: "${SMART_DATA_DB_TYPE:com.alibaba.druid.pool.DruidDataSource}"
    driver-class-name: "${SMART_DATA_DB_DRIVER:oracle.jdbc.driver.OracleDriver}"
    username: "${SMART_DATA_DB_USERNAME:${SMART_DB_USERNAME:}}"
    password: "${SMART_DATA_DB_PASSWORD:${SMART_DB_PASSWORD:}}"
    jdbc-url: "${SMART_DATA_DB_URL:${SMART_DB_URL:}}"
    stat-view-servlet:
      url-pattern: /druid/*
      # IP 白名单，没有配置或者为空，则允许所有访问
      allow: 127.0.0.1
      # 禁用 HTML 中 Reset All 按钮
      reset-enable: false
      # 登录用户名/密码
      login-username: "${SMART_DATA_DB_DRUID_LOGIN_USERNAME:}"
      login-password: "${SMART_DATA_DB_DRUID_LOGIN_PASSWORD:}"
      # 需要设置enabled=true,否则会报出There was an unexpected error (type=Not Found, status=404).错误，或者将druid-spring-boot-starter的版本降低到1.1.10及以下
      # 是否启用StatViewServlet（监控页面）默认值为false（考虑到安全问题默认并未启动，如需启用建议设置密码或白名单以保障安全）
      enabled: false
  main:
    allow-bean-definition-overriding: true
  sms:
    #url: http://10.0.20.97:81/SOS.WebFramework/SMSBll/SendSMS
    url: "${SMART_SMS_URL:}"
    systemName: 智慧系统
    remarks: 智慧系统
    token: "${SMART_SMS_TOKEN:}"      #token
  oa:
    staff:
      query-url: "${SMART_OA_STAFF_QUERY_URL:}"
      query-token: "${SMART_OA_STAFF_QUERY_TOKEN:}"      #token
  #邮箱配置
  mail:
    host: "${SMART_MAIL_HOST:}"
    username: "${SMART_MAIL_USERNAME:}"
    password: "${SMART_MAIL_PASSWORD:}"
    default-encoding: utf-8
    port: 25

