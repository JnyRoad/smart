spring:
  datasource:
    type: "${SMART_AUTH_DB_TYPE:com.zaxxer.hikari.HikariDataSource}"
    driver-class-name: "${SMART_AUTH_DB_DRIVER:oracle.jdbc.driver.OracleDriver}"
    username: "${SMART_AUTH_DB_USERNAME:${SMART_DB_USERNAME:}}"
    password: "${SMART_AUTH_DB_PASSWORD:${SMART_DB_PASSWORD:}}"
    url: "${SMART_AUTH_DB_URL:${SMART_DB_URL:}}"
  freemarker:
    allow-request-override: false
    allow-session-override: false
    cache: true
    charset: UTF-8
    check-template-location: true
    content-type: text/html
    enabled: true
    expose-request-attributes: false
    expose-session-attributes: false
    expose-spring-macro-helpers: true
    prefer-file-system-access: true
    suffix: ".ftl"
    template-loader-path: classpath:/templates/
server:
  port: 3000
