## spring security 配置
security:
  oauth2:
    client:
      client-id: "${SMART_DISPATCHER_OAUTH_CLIENT_ID:${SMART_OAUTH_CLIENT_ID:}}"        # guard
      client-secret: "${SMART_DISPATCHER_OAUTH_CLIENT_SECRET:${SMART_OAUTH_CLIENT_SECRET:}}"    # guard
      scope: server
      # 放行url
      ignore-urls:
        - /**