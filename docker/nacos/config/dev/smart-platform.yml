spring:
  datasource:
    type: "${SMART_PLATFORM_DB_TYPE:com.alibaba.druid.pool.DruidDataSource}"
    driver-class-name: "${SMART_PLATFORM_DB_DRIVER:oracle.jdbc.driver.OracleDriver}"
    username: "${SMART_PLATFORM_DB_USERNAME:${SMART_DB_USERNAME:}}"
    password: "${SMART_PLATFORM_DB_PASSWORD:${SMART_DB_PASSWORD:}}"
    url: "${SMART_PLATFORM_DB_URL:${SMART_DB_URL:}}"
  main:
    allow-bean-definition-overriding: true
  ocr:
    username: "${SMART_OCR_USERNAME:}"
    url: "${SMART_OCR_URL:}"
  yuto-secsytem:
    phone:
      update-url: "${SMART_SECSYSTEM_PHONE_UPDATE_URL:}"
      update-token: "${SMART_SECSYSTEM_PHONE_UPDATE_TOKEN:}"
  face:
    comparevalue: 0.65
    login-compare-value: 0.7
  dormitory:
    datenum: 25
  oa:
    process:
      request:
        leave-url: "${SMART_OA_PROCESS_LEAVE_URL:}"
        leave-token: "${SMART_OA_PROCESS_LEAVE_TOKEN:}"
        log-url: "${SMART_OA_PROCESS_LOG_URL:}"
        log-token: "${SMART_OA_PROCESS_LOG_TOKEN:}"
  visitor:
    put-offset-hour: 2
    # overtime-offset-hour 已废弃删除：超时清理固定按"预约结束时间已过"判定，
    # 提前量会把仍在 OA 审批中的短期单提前终态化（2026-07-07 生产事故根因）
    arrived-offset-hour: 24
    arrived-send: true
    arrived-send-message-offset-minute: 30
    pre-send: true
    pre-send-message-offset-minute: 30
    push-email: "./预约记录.xlsx"
    code-url: "${SMART_VISITOR_CODE_URL:}"
    remote-url: "${SMART_VISITOR_REMOTE_URL:}"
    remote-path: D:\\visitor\\
    hf-token: "${SMART_VISITOR_HF_TOKEN:}"
  image:
    base-url: "${SMART_PLATFORM_IMAGE_BASE_URL:}"
    down-url: "${SMART_PLATFORM_IMAGE_DOWN_URL:}"
    base-park-url: "${SMART_PLATFORM_IMAGE_BASE_PARK_URL:}"
  release:
    sms-url: "${SMART_RELEASE_SMS_URL:}"
  temp:
    auth: "${SMART_TEMP_AUTH:}"
  admittance:
    sms-url: "${SMART_ADMITTANCE_SMS_URL:}"
    pretime: 30
    remote-url: "${SMART_ADMITTANCE_REMOTE_URL:}"
    # 已废弃：Task 3 起推送 filePath 已改传相对文件名，本字段成死代码；
    # 保留仅为兼容旧配置读取路径，推送功能整体退役（见上线 checklist 第 4 步）时随之删除。
    save-path: D:/visitor/
    # 照片推送总开关：true=推送与拉取并存（当前上线阶段），false=仅拉取（推送退役后终态）。
    # 对应 SmtAdmittanceApplyServiceImpl#photoPushEnabled（@Value("${spring.admittance.photo-push-enabled:true}")）。
    photo-push-enabled: true
  park-set:
    lg-park-id: 27
  lock:
    send:
      url: "${SMART_LOCK_SEND_URL:http://host.docker.internal:8001/person/dormitory}"
    base:
      url: "${SMART_LOCK_BASE_URL:http://host.docker.internal:8001}"
  msg-push:
    quitdor: "${SMART_MSG_PUSH_QUITDOR_URL:}"
    release: "${SMART_MSG_PUSH_RELEASE_URL:}"
    repairs: "${SMART_MSG_PUSH_REPAIRS_URL:}"
  file:
    base-url: "${SMART_PLATFORM_FILE_BASE_URL:}"
  settlement:
    check-token: "${SMART_SETTLEMENT_CHECK_TOKEN:}"
swagger:
  enabled: false
smart:
  xc-park-id: 5000021
  sy-park-id: 161
  hf-park-id: 10001
  meter:
    prod: 200
    life: 100
server:
  port: 6030
