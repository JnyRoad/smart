## spring security 配置
security:
  inner:
    # Platform 到 UPMS 的用户管理调用只使用专属服务令牌。
    service-token:
      client-id: "${SMART_PLATFORM_OAUTH_CLIENT_ID:}"
      client-secret: "${SMART_PLATFORM_OAUTH_CLIENT_SECRET:}"
      access-token-uri: "${SMART_PLATFORM_OAUTH_TOKEN_URI:}"
    # 全园区列表仅允许 App、定时任务两个受管服务 client；未注入配置时控制器必须拒绝调用。
    park:
      # Dispatcher 读取动态 Bridge 目标只能使用专属受管服务 client；未注入配置时必须拒绝调用。
      dispatcher-client-id: "${SMART_PARK_DISPATCHER_CLIENT_ID:}"
      list-client-ids: "${SMART_PARK_LIST_CLIENT_IDS:}"
    # 充值定时任务仅允许 Smart Schedule 的受管服务 client；未注入配置时必须拒绝调用。
    recharge:
      schedule-client-id: "${SMART_RECHARGE_SCHEDULE_CLIENT_ID:}"
    # 物流同步定时任务仅允许 Smart Schedule 的受管服务 client；未注入配置时必须拒绝调用。
    logistics:
      schedule-client-id: "${SMART_LOGISTICS_SCHEDULE_CLIENT_ID:}"
  oauth2:
    client:
      client-id: "${SMART_PLATFORM_OAUTH_CLIENT_ID:${SMART_OAUTH_CLIENT_ID:}}"        # platform
      client-secret: "${SMART_PLATFORM_OAUTH_CLIENT_SECRET:${SMART_OAUTH_CLIENT_SECRET:}}"    # platform
      scope: server
      # 仅保留无敏感信息的存活探针；访客人脸三个精确路径由控制器校验微信 code 派生的草稿会话和一次性能力，
      # 不得扩展为 /admittance/** 或任何通配路径。
      ignore-urls:
        - /actuator/health
        - /admittance/apply/get/openId
        - /admittance/visitor-face/capability
        - /admittance/visitor-face/crop
        # 简历公开流程仅放行受一次性 HttpOnly capability 约束的两个 POST 路径，禁止使用 /regist/**。
        - /regist/save/identification
        - /regist/face/crop
        - /regist/face/add
spring:
