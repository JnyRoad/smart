        # 数据源配置
spring:
  #  datasource:
  #    type: com.zaxxer.hikari.HikariDataSource
  #    driver-class-name: oracle.jdbc.driver.OracleDriver
  #    username: platform2
  #    password: 123456
  #    url: jdbc:oracle:thin:@smart-oracle:1521:orcl
  datasource:
    type: "${SMART_PLATFORM_DB_TYPE:com.alibaba.druid.pool.DruidDataSource}"
    driver-class-name: "${SMART_PLATFORM_DB_DRIVER:oracle.jdbc.driver.OracleDriver}"
    username: "${SMART_PLATFORM_DB_USERNAME:${SMART_DB_USERNAME:}}"
    password: "${SMART_PLATFORM_DB_PASSWORD:${SMART_DB_PASSWORD:}}"
    url: "${SMART_PLATFORM_DB_URL:${SMART_DB_URL:}}"
  main:
    allow-bean-definition-overriding: true
    # Ocr服务
  ocr:
    username: "${SMART_OCR_USERNAME:}"
    url: "${SMART_OCR_URL:}"
  yuto-secsytem:
    phone:
      #update-url: http://10.0.20.97:81/SOS.WebFramework/Base_UserBll/RevisePhone
      update-url: "${SMART_SECSYSTEM_PHONE_UPDATE_URL:}"
      update-token: "${SMART_SECSYSTEM_PHONE_UPDATE_TOKEN:}"
  face:
    comparevalue: 0.65
    login-compare-value: 0.70
  dormitory:
    datenum: 25
  oa:
    process:
      request:
        leave-url: "${SMART_OA_PROCESS_LEAVE_URL:}"          #推送离职流程URL
        leave-token: "${SMART_OA_PROCESS_LEAVE_TOKEN:}"      #token
        log-url: "${SMART_OA_PROCESS_LOG_URL:}"      #查询流程流转记录接口
        log-token: "${SMART_OA_PROCESS_LOG_TOKEN:}"      #token
  visitor:
    put-offset-hour: 2                          #访客预约提前多久下发设备权限(设备权限生效时间=预约开始时间提前N小时)
    overtime-offset-hour: 0                     #访客过期未到超时多久删除设备权限(未使用)
    arrived-offset-hour: 24                      #已到访客超时多久删除设备权限(未使用)
    arrived-send: true                          #已到访客提前多久发送提醒短信
    arrived-send-message-offset-minute: 30      #已到访客提前多久发送提醒短信
    pre-send: true                              #访客预约是否提前发送提醒短信（预约成功后，快到预约时间时发送提醒短信）
    pre-send-message-offset-minute: 30          #访客预约提前多久发送提醒短信（预约成功后，快到预约时间时发送提醒短信）
    push-email: ./预约记录.xlsx                    #访客信息推送至邮件
    code-url: "${SMART_VISITOR_CODE_URL:}"            #访客码短信url
   # remote-url: smb://liuwc@szyuto.com:LIU0987654321·@10.13.140.28/visitor/,smb://Administrator:040117@222.181.144.146/visitor/  #访客凭条打印头像图片上传地址
    remote-url: "${SMART_VISITOR_REMOTE_URL:}"
    remote-path: D:\\visitor\\ #访客凭条打印头像图片上传路径
    hf-token: "${SMART_VISITOR_HF_TOKEN:}"
#图片访问
  image:
    #内网访问地址
    base-url: "${SMART_PLATFORM_IMAGE_BASE_URL:}"
    down-url: "${SMART_PLATFORM_IMAGE_DOWN_URL:}"
    base-park-url: "${SMART_PLATFORM_IMAGE_BASE_PARK_URL:}"
    #人脸比对阈值
  #放行短信url
  release:
    #短信跳转
    sms-url: "${SMART_RELEASE_SMS_URL:}"
  temp:
    auth: "${SMART_TEMP_AUTH:}"
  admittance:
    sms-url: "${SMART_ADMITTANCE_SMS_URL:}"
    pretime: 30
    # 世平本地 smb://Administrator:Q@10.0.200.2/visitor/ ，smb://liuwc@szyuto.com:LIU0987654321·@10.13.140.28/visitor/,smb://Administrator:admin123456@10.13.140.28/visitor/
    # smb://.\Administrator:Yuto@9231!@10.13.140.154/visitor/
    # smb://Administrator:Yuto@9231!@10.13.140.154/visitor/
    #remote-url: '[{ip:"10.13.140.139",url:"smb://10.13.140.139/visitor//",password:"Yuto9231!",user:"Administrator"},{ip:"10.13.140.154",url:"smb://10.13.140.154/visitor//",password:"Yuto@9231!",user:"Administrator"},{ip:"10.13.140.215",url:"smb://10.13.140.215/visitor/",password:"admin123456",user:".\\administrator"}]'
    remote-url: "${SMART_ADMITTANCE_REMOTE_URL:}"
    save-path: D:/visitor/
    photo-push-enabled: true
  park-set:
    lg-park-id: 27

  lock:
    send:
      url: "${SMART_LOCK_SEND_URL:http://host.docker.internal:8001/person/dormitory}"
    base:
      url: "${SMART_LOCK_BASE_URL:http://host.docker.internal:8001}"

  msg-push:
    quitdor: "${SMART_MSG_PUSH_QUITDOR_URL:}"
    release: "${SMART_MSG_PUSH_RELEASE_URL:}"
    repairs: "${SMART_MSG_PUSH_REPAIRS_URL:}"
  # admittance: https://xuchang.szyuto.com/#/xuchang/backLog/dormRepairs/detail?id={id}&curTabIndex=0

  file:
    base-url: "${SMART_PLATFORM_FILE_BASE_URL:}"

  settlement:
    check-token: "${SMART_SETTLEMENT_CHECK_TOKEN:}"

swagger:
  enabled: false

#C6同步数据
smart:
  # 许昌园区ID
  xc-park-id: 5000021
  sy-park-id: 161
  # 合肥园区ID
  hf-park-id: 10001
  meter:
    prod: 200  #生产水电表阈值
    life: 100  #生活水电表阈值
  energy:
    zone-id: Asia/Shanghai #能耗业务日与对外月累计的服务器时区口径
    boundary-tolerance-minutes: 120 #日界读数允许的最大回溯分钟数
    backfill:
      max-requests: 1000 #单次受控回填最多接受的表计日投影请求数
    projection:
      max-retry-count: 3 #单条投影失败后的最大尝试次数
      retry-delay-minutes: 5 #可重试投影再次入队前的延迟分钟数
  park:
    xc-id: 5000021
  org:
    # index-code: 36b28cbf-74ca-4393-82a0-5d8e5d8115db
    # 许昌外包工ISC组织编码
    xc-hpo-index-code: "${SMART_ORG_XC_HPO_INDEX_CODE:}"
    # 许昌访客ISC组织编码
    xc-visitor-index-code: "${SMART_ORG_XC_VISITOR_INDEX_CODE:}"
    hf-index-code: "${SMART_ORG_HF_INDEX_CODE:}"