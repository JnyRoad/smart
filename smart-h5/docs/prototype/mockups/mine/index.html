<!doctype html>
<html lang="zh-CN">
<!--
  原型：个人中心
  旧路由：/xuchang/mine
  旧组件：views-mobile/pages/mine/index.vue + components/menu-list.vue
  接口：
    POST /wechat/xc/unbind  微信解绑（成功 → toast「解绑成功」→ 清 token → 跳微信 OAuth 工牌登录）
    （展示数据来自首页缓存的 GET /employee/baseinfo / parkInfo，本页不发新请求）
  跳转：
    头部信息块 → /xuchang/mine/detail
    我的宿舍 → /xuchang/dorm
    帮助中心 → /xuchang/help
    微信解绑 → confirm 弹窗「是否确认解除微信绑定？」
    返回按钮 → /xuchang/home
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>裕同智慧园区 · 个人中心</title>
<style>
:root {
  --brand-orange: #EC6C00;
  --accent-strong: #D95F00;
  --accent-soft: #FFF1E3;
  --accent-ink: #5A2600;
  --white: #FFFFFF;
  --surface: #F7F7F7;
  --yuto-black: #595757;
  --mid-gray: #8C8A8A;
  --weak-gray: #AAA7A7;
  --light-gray: #E5E3E3;
  --border-soft: #EFEEEE;
  --success: #16A673;
  --warning: #C98416;
  --danger: #D83B36;
  --info: #2376D9;
  --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
  --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
  --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--surface); color: var(--yuto-black); font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100dvh; }
button { font: inherit; border: 0; cursor: pointer; background: none; color: inherit; padding: 0; }
.app { width: min(100%, 430px); margin: 0 auto; min-height: 100dvh; background: var(--white); box-shadow: var(--shadow-large); position: relative; overflow: hidden; }
.page { min-height: 100dvh; padding-bottom: max(24px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, var(--accent-soft) 0, rgba(255,241,227,.35) 150px, var(--surface) 240px); }
.demo-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #3A3838; color: #fff; font-size: 12px; overflow-x: auto; }
.demo-bar .tag { flex: none; font-weight: 750; color: #FFC58A; }
.demo-bar button { flex: none; min-height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 12px; }
.demo-bar button.on { background: var(--brand-orange); font-weight: 650; }
.topbar { display: flex; align-items: center; padding: max(14px, env(safe-area-inset-top)) 8px 6px; }
.back { width: 44px; height: 44px; display: grid; place-items: center; color: var(--yuto-black); }
.title { flex: 1; text-align: center; font-size: 16px; font-weight: 750; }
.topbar .ph { width: 44px; }

.profile { width: calc(100% - 32px); margin: 6px 16px 12px; display: flex; align-items: center; gap: 14px; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-panel); padding: 16px; text-align: left; }
.avatar { flex: none; width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--brand-orange), #F49A4A); color: #fff; display: grid; place-items: center; font-size: 24px; font-weight: 750; }
.p-body { flex: 1; min-width: 0; }
.p-name { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 750; }
.sex { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.sex.boy { background: var(--info); }
.sex.girl { background: #E0578F; }
.p-mobile { margin-top: 6px; font-size: 14px; color: var(--mid-gray); }
.arrow { flex: none; color: var(--weak-gray); }

.park-banner { margin: 0 16px 12px; border-radius: 16px; padding: 18px 16px; color: #fff; background: linear-gradient(120deg, var(--brand-orange), #F08A2C 60%, #F6A95C); box-shadow: 0 12px 28px rgba(236,108,0,.25); display: flex; align-items: center; gap: 10px; }
.park-banner .pin { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.22); display: grid; place-items: center; }
.park-banner .pn { font-size: 15px; font-weight: 700; }

.stats { margin: 0 16px 12px; display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-panel); padding: 16px 6px; text-align: center; }
.stats .v { font-size: 14px; font-weight: 700; }
.stats .l { margin-top: 6px; font-size: 12px; color: var(--weak-gray); }

.menu { margin: 0 16px; display: grid; gap: 12px; }
.menu-item { display: flex; align-items: center; gap: 14px; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-panel); padding: 16px; min-height: 56px; width: 100%; text-align: left; }
.m-icon { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; }
.m-icon.dorm { background: var(--accent-soft); color: var(--accent-strong); }
.m-icon.help { background: rgba(35,118,217,.10); color: var(--info); }
.m-icon.wechat { background: rgba(22,166,115,.10); color: var(--success); }
.m-title { flex: 1; font-size: 15px; font-weight: 700; }

.back-btn-wrap { padding: 26px 16px 0; }
.btn-secondary { width: 100%; height: 48px; border-radius: 14px; background: var(--white); border: 1.5px solid var(--brand-orange); color: var(--brand-orange); font-size: 15px; font-weight: 650; }

.mask { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 30; }
.mask.show { display: block; }
.dialog { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%); width: 300px; background: #fff; border-radius: 16px; padding: 24px 20px 16px; text-align: center; }
.dialog p { margin: 0 0 18px; font-size: 15px; color: var(--yuto-black); line-height: 1.6; }
.dialog .row { display: flex; gap: 10px; }
.dialog .btn-cancel { flex: 1; height: 46px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border-soft); color: var(--mid-gray); font-size: 15px; }
.dialog .btn-ok { flex: 1; height: 46px; border-radius: 14px; background: var(--brand-orange); color: #fff; font-weight: 650; font-size: 15px; }
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(58,56,56,.92); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; display: none; z-index: 40; white-space: nowrap; }
.note { padding: 14px 18px 0; font-size: 11px; color: var(--weak-gray); line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <div class="demo-bar">
    <span class="tag">原型演示</span>
    <button class="on" data-state="normal">正常(男)</button>
    <button data-state="girl">女性别图标</button>
    <button data-state="missing">字段缺省</button>
    <button data-state="unbind">解绑确认弹窗</button>
    <button data-state="unbind-fail">解绑失败</button>
  </div>

  <div class="page">
    <div class="topbar">
      <button class="back" onclick="demoToast('返回 /xuchang/home')" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="title">个人中心</span>
      <span class="ph"></span>
    </div>

    <!-- 头部信息（→ 个人信息页） -->
    <button class="profile" onclick="demoToast('跳转 /xuchang/mine/detail')">
      <span class="avatar" id="avatar">王</span>
      <span class="p-body">
        <span class="p-name">
          <span id="empName">王建国</span>
          <span class="sex boy" id="sexIcon" title="男">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="14" r="6"/><path d="M14.5 9.5L21 3"/><path d="M15 3h6v6"/></svg>
          </span>
        </span>
        <span class="p-mobile" id="empMobile">138 3741 5260</span>
      </span>
      <span class="arrow">›</span>
    </button>

    <!-- 园区横幅 -->
    <div class="park-banner">
      <span class="pin"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
      <span class="pn">裕同科技许昌园区</span>
    </div>

    <!-- 三列信息 -->
    <div class="stats">
      <div><div class="v" id="deptName">智能制造一部</div><div class="l">所属部门</div></div>
      <div><div class="v" id="jobName">设备工程师</div><div class="l">担任职务</div></div>
      <div><div class="v" id="statusDes">在职</div><div class="l">人员状态</div></div>
    </div>

    <!-- 菜单 -->
    <div class="menu">
      <button class="menu-item" onclick="demoToast('跳转 /xuchang/dorm')">
        <span class="m-icon dorm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M4 20V8l8-5 8 5v12"/><rect x="9" y="13" width="6" height="7"/></svg></span>
        <span class="m-title">我的宿舍</span>
        <span class="arrow">›</span>
      </button>
      <button class="menu-item" onclick="demoToast('跳转 /xuchang/help')">
        <span class="m-icon help"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 .3c0 1.7-2.5 2.2-2.5 3.7"/><circle cx="12" cy="17" r=".5"/></svg></span>
        <span class="m-title">帮助中心</span>
        <span class="arrow">›</span>
      </button>
      <button class="menu-item" onclick="showUnbind()">
        <span class="m-icon wechat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a5.5 5.5 0 0 1 5 5.4c0 1.6-.8 3-2 4l.6 2.2-2.3-1.2a7 7 0 0 1-1.3.2A5.5 5.5 0 0 1 10.7 14"/><path d="M14.5 8.6A6.5 6.5 0 0 0 8 3a6.4 6.4 0 0 0-6.5 6.3c0 1.9 1 3.6 2.4 4.7L3.2 16l2.7-1.4c.7.2 1.4.3 2.1.3"/></svg></span>
        <span class="m-title">微信解绑</span>
        <span class="arrow">›</span>
      </button>
    </div>

    <div class="back-btn-wrap">
      <button class="btn-secondary" onclick="demoToast('返回 /xuchang/home')">返回</button>
    </div>

    <p class="note">注：展示数据来自首页缓存的 /employee/baseinfo（姓名/性别/手机号/部门/职务/状态）与本地园区信息；解绑成功后清 token 并跳微信授权回到工牌登录页。</p>
  </div>

  <!-- 解绑确认弹窗 -->
  <div class="mask" id="unbindMask">
    <div class="dialog">
      <p>是否确认解除微信绑定？</p>
      <div class="row">
        <button class="btn-cancel" onclick="hideUnbind()">取消</button>
        <button class="btn-ok" onclick="hideUnbind();demoToast('解绑成功 → 清 token → 跳微信授权登录')">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
var toastTimer;
function demoToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.display = 'none'; }, 1800);
}
function showUnbind(){ document.getElementById('unbindMask').classList.add('show'); }
function hideUnbind(){ document.getElementById('unbindMask').classList.remove('show'); }
function setProfile(name, mobile, dept, job, status, girl){
  document.getElementById('empName').textContent = name;
  document.getElementById('avatar').textContent = name.charAt(0);
  document.getElementById('empMobile').textContent = mobile;
  document.getElementById('deptName').textContent = dept;
  document.getElementById('jobName').textContent = job;
  document.getElementById('statusDes').textContent = status;
  var s = document.getElementById('sexIcon');
  s.className = 'sex ' + (girl ? 'girl' : 'boy');
  s.title = girl ? '女' : '男';
}
document.querySelectorAll('.demo-bar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.demo-bar button').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    hideUnbind();
    setProfile('王建国', '138 3741 5260', '智能制造一部', '设备工程师', '在职', false);
    switch(btn.dataset.state){
      case 'girl': setProfile('李秀兰', '152 0374 8821', '行政服务部', '前台专员', '在职', true); break;
      case 'missing': setProfile('王建国', '138 3741 5260', '-', '-', '-', false); break;
      case 'unbind': showUnbind(); break;
      case 'unbind-fail': demoToast('网络错误'); break;
    }
  });
});
</script>
</body>
</html>
