<!doctype html>
<html lang="zh-CN">
<!--
  页面：入厂申请（合肥）— 添加随行人员（免登录）
  旧路由：/xuchang/visitor/addPersonHefei
  旧组件：smart-h5/src/views-mobile/pages/visitor/add-person-hefei.vue（+ page3-bottom）
  接口：
    GET /admittance/apply/enum/person/cert   证件类型枚举
  路由 query：itemInfo（编辑回填 JSON）、itemIndex、isEdit、cause
  跳转：提交成功 → /xuchang/visitor/addPersonList?idHefei=true&cause=<cause>（随行人员列表）
  与标准版（add-person.vue）差异：
    - 多出字段：证件类型 picker、证件照片（query cause==5 || cause==7 时显示）；标准版只有姓名+照片+证件号码 3 项。
    - 提交时先做身份证号格式校验（cardid），非法 toast 校验信息后终止。
    - 返回随行人员列表时携带 idHefei=true&cause query；标准版不带 query。
  数据流：新增 push / 编辑 splice 替换 → 写 localStorage fellowInfo（字段 fellowName/fellowPhotoId/certType/certNo/certPic）。
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>入厂申请（合肥）· 添加随行人员</title>
  <style>
    :root {
      --brand-orange: #EC6C00;
      --accent-strong: #D95F00;
      --accent-soft: #FFF1E3;
      --accent-ink: #5A2600;
      --white: #FFFFFF;
      --surface: #F7F7F7;
      --yuto-black: #595757;
      --mid-gray: #8C8A8A;
      --weak-gray: #AAA7A7;
      --light-gray: #E5E3E3;
      --border-soft: #EFEEEE;
      --success: #16A673;
      --warning: #C98416;
      --danger: #D83B36;
      --info: #2376D9;
      --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
      --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
      --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--surface); color: var(--yuto-black); font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
    body { min-height: 100dvh; margin: 0; background: var(--surface); }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; background: none; }
    input:focus-visible, button:focus-visible { outline: 3px solid rgba(236, 108, 0, 0.22); outline-offset: 2px; }
    .app {
      position: relative; width: min(100%, 430px); min-height: 100dvh; margin: 0 auto;
      background: var(--white); box-shadow: var(--shadow-large); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .page {
      flex: 1; display: flex; flex-direction: column;
      padding: max(14px, env(safe-area-inset-top)) 18px 0;
      background: linear-gradient(180deg, rgba(255, 241, 227, 0.72) 0, rgba(255, 255, 255, 0) 220px), var(--white);
    }
    .topbar { display: flex; align-items: center; min-height: 46px; }
    .back-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; border-radius: 14px; color: var(--yuto-black); }
    .back-btn svg { display: block; }
    .page-title { flex: 1; text-align: center; font-size: 16px; font-weight: 750; }
    .topbar-spacer { width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; }
    .hefei-badge {
      display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 10px;
      border: 1px solid rgba(236, 108, 0, 0.22); border-radius: 999px;
      background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 650; white-space: nowrap;
    }
    .hefei-badge::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--brand-orange); }
    .card {
      margin-top: 16px; padding: 16px; border: 1px solid var(--border-soft);
      border-radius: 16px; background: var(--white); box-shadow: var(--shadow-panel);
    }
    .card-title { margin: 2px 2px 14px; font-size: 16px; font-weight: 750; }
    .card-title small { margin-left: 6px; font-size: 12px; font-weight: 400; color: var(--weak-gray); }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 4px; }
    .field-label { display: block; margin: 0 2px 7px; font-size: 13px; color: var(--mid-gray); }
    .field-label .req { color: var(--danger); margin-left: 2px; }
    .field-input {
      display: block; width: 100%; height: 48px; padding: 0 14px;
      border: 1px solid var(--border-soft); border-radius: 12px; background: var(--white);
      color: var(--yuto-black); font-size: 15px;
    }
    .field-input::placeholder { color: var(--weak-gray); }
    /* 选择行（picker） */
    .select-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--border-soft);
      border-radius: 12px; background: var(--white); color: var(--yuto-black); font-size: 15px; text-align: left;
    }
    .select-row .value { flex: 1; }
    .select-row .placeholder { color: var(--weak-gray); }
    .select-row .arrow { color: var(--weak-gray); flex: none; display: flex; }
    /* 上传位 */
    .upload-row { display: flex; gap: 12px; align-items: flex-start; }
    .upload-box {
      position: relative; width: 92px; height: 92px; border: 1px dashed var(--light-gray);
      border-radius: 12px; background: #FBFBFB; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px; color: var(--weak-gray); font-size: 12px;
    }
    .upload-box.filled { border-style: solid; border-color: var(--border-soft); background: var(--accent-soft); color: var(--accent-ink); }
    .upload-box svg { display: block; }
    .upload-note { flex: 1; font-size: 12px; line-height: 1.6; color: var(--weak-gray); padding-top: 4px; }
    .face-tag {
      position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 999px;
      background: rgba(22, 166, 115, 0.12); color: var(--success); font-size: 10px; font-weight: 650;
    }
    .bottom-bar {
      position: sticky; bottom: 0; margin-top: auto; padding: 14px 18px max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255,255,255,0) 0, var(--white) 24%);
    }
    /* 旧按钮为圆角描边样式（is-round is-plain），原型保留描边形态 */
    .btn-outline {
      display: flex; align-items: center; justify-content: center; width: 100%; height: 48px;
      border: 1.5px solid var(--brand-orange); border-radius: 999px; background: var(--white);
      color: var(--brand-orange); font-size: 16px; font-weight: 650;
    }
    .btn-outline:active { background: var(--accent-soft); }
    /* 底部选择面板（picker） */
    .sheet-mask { position: absolute; inset: 0; z-index: 30; background: rgba(89, 87, 87, 0.45); display: flex; align-items: flex-end; }
    .sheet-mask[hidden] { display: none; }
    .sheet { width: 100%; border-radius: 18px 18px 0 0; background: var(--white); padding: 14px 16px max(20px, env(safe-area-inset-bottom)); }
    .sheet-title { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 10px; font-size: 15px; font-weight: 750; }
    .sheet-close { width: 44px; height: 34px; color: var(--mid-gray); font-size: 13px; text-align: right; }
    .sheet-options { max-height: 42dvh; overflow-y: auto; }
    .sheet-option {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      min-height: 48px; padding: 0 6px; border-bottom: 1px solid var(--border-soft);
      font-size: 15px; color: var(--yuto-black); text-align: left;
    }
    .sheet-option:last-child { border-bottom: 0; }
    .sheet-option .check { color: var(--brand-orange); font-weight: 700; visibility: hidden; }
    .sheet-option.selected { color: var(--accent-strong); font-weight: 650; }
    .sheet-option.selected .check { visibility: visible; }
    .toast {
      position: absolute; left: 50%; bottom: 130px; z-index: 40; transform: translateX(-50%);
      max-width: 80%; padding: 10px 16px; border-radius: 12px; background: rgba(89, 87, 87, 0.92);
      color: var(--white); font-size: 13px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    /* 原型演示切换条 */
    .demo-strip {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding: 8px 10px;
      border: 1px dashed var(--light-gray); border-radius: 12px; background: #FBFBFB;
    }
    .demo-strip span { font-size: 12px; color: var(--weak-gray); white-space: nowrap; }
    .demo-strip button { min-height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border-soft); background: var(--white); font-size: 12px; color: var(--mid-gray); }
    .demo-strip button.on { border-color: var(--brand-orange); color: var(--accent-strong); font-weight: 650; }
  </style>
</head>
<body>
  <div class="app">
    <div class="page">
      <header class="topbar">
        <button class="back-btn" type="button" aria-label="返回" onclick="showToast('返回随行人员列表（addPersonList?idHefei=true&cause=…）')">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M13.5 4.5 7 11l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 class="page-title" id="pageTitle">添加随行人员</h1>
        <div class="topbar-spacer"><span class="hefei-badge">合肥流程</span></div>
      </header>

      <section class="card" aria-label="随行人员信息">
        <h2 class="card-title">随行人员信息<small id="modeNote">（新增）</small></h2>

        <div class="field">
          <label class="field-label" for="fellowName">访客姓名<span class="req">*</span></label>
          <input class="field-input" id="fellowName" placeholder="请输入" value="张志强">
        </div>

        <div class="field">
          <span class="field-label">访客照片<span class="req">*</span>（需通过人脸检测）</span>
          <div class="upload-row">
            <div class="upload-box filled">
              <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="9.5" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 22c1.4-4 4.6-6 8.5-6s7.1 2 8.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <span>已上传</span>
              <span class="face-tag">人脸检测通过</span>
            </div>
            <p class="upload-note">请上传随行人员正面免冠照片，将用于门岗人脸核验；检测不到人脸将无法提交。</p>
          </div>
        </div>

        <div class="field">
          <span class="field-label">证件类型<span class="req">*</span></span>
          <button class="select-row" type="button" onclick="openSheet()">
            <span class="value" id="certValue">居民身份证</span>
            <span class="arrow"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m6 3.5 4.5 4.5L6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
        </div>

        <div class="field">
          <label class="field-label" for="certNo">证件号码<span class="req">*</span>（提交时校验身份证格式）</label>
          <input class="field-input" id="certNo" placeholder="请输入" value="340111199011273516">
        </div>

        <!-- 证件照片：仅当路由 query cause==5 || cause==7 时显示 -->
        <div class="field" id="certPicField" hidden>
          <span class="field-label">证件照片<span class="req">*</span>（当前事由要求上传）</span>
          <div class="upload-row">
            <div class="upload-box">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <span>请上传证件照片</span>
            </div>
            <p class="upload-note">来访事由为「施工作业」「设备维修」时，随行人员须上传证件照片备案。</p>
          </div>
        </div>
      </section>

      <div class="demo-strip" aria-label="原型演示">
        <span>原型演示：</span>
        <button type="button" class="on" onclick="setMode('add', this)">新增模式</button>
        <button type="button" onclick="setMode('edit', this)">编辑模式</button>
        <button type="button" id="causeBtn" onclick="toggleCause(this)">事由=施工作业（显示证件照片）</button>
        <button type="button" onclick="demoBadCert()">身份证校验失败</button>
      </div>

      <div class="bottom-bar">
        <button class="btn-outline" type="button" id="submitBtn" onclick="apply()">确认添加随行人员</button>
      </div>
    </div>

    <!-- 证件类型选择面板：GET /admittance/apply/enum/person/cert -->
    <div class="sheet-mask" id="sheetMask" hidden onclick="if(event.target===this)closeSheet()">
      <div class="sheet" role="dialog" aria-modal="true" aria-label="证件类型">
        <div class="sheet-title"><span>证件类型</span><button class="sheet-close" type="button" onclick="closeSheet()">取消</button></div>
        <div class="sheet-options" id="sheetOptions"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script>
    // 证件类型枚举 mock：真实数据来自 GET /admittance/apply/enum/person/cert（desc/code）
    const CERT_OPTIONS = [
      { code: 1, desc: '居民身份证' },
      { code: 2, desc: '护照' },
      { code: 3, desc: '港澳通行证' },
      { code: 4, desc: '驾驶证' }
    ];
    let certSelected = 1;
    let isEdit = false;          // 路由 query isEdit：编辑模式 splice 替换，新增模式 push
    let causeRequiresPic = false; // 路由 query cause==5 || cause==7 时显示证件照片
    let badCertDemo = false;
    let toastTimer = null;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }
    function setMode(mode, btn) {
      isEdit = mode === 'edit';
      document.querySelectorAll('.demo-strip button').forEach(b => { if (b.id !== 'causeBtn') b.classList.remove('on'); });
      btn.classList.add('on');
      // 旧逻辑：编辑模式从 query itemInfo 回填，按钮文案为「确认修改随行人员」
      document.getElementById('submitBtn').textContent = isEdit ? '确认修改随行人员' : '确认添加随行人员';
      document.getElementById('modeNote').textContent = isEdit ? '（编辑回填）' : '（新增）';
      document.getElementById('pageTitle').textContent = isEdit ? '修改随行人员' : '添加随行人员';
    }
    function toggleCause(btn) {
      causeRequiresPic = !causeRequiresPic;
      btn.classList.toggle('on', causeRequiresPic);
      document.getElementById('certPicField').hidden = !causeRequiresPic;
    }
    function demoBadCert() {
      badCertDemo = true;
      document.getElementById('certNo').value = '34011119901127351X';
      showToast('已填入非法身份证号，点击底部按钮体验校验拦截');
    }
    function openSheet() {
      const box = document.getElementById('sheetOptions');
      box.innerHTML = '';
      CERT_OPTIONS.forEach(opt => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sheet-option' + (opt.code === certSelected ? ' selected' : '');
        btn.innerHTML = '<span>' + opt.desc + '</span><span class="check">✓</span>';
        btn.onclick = () => {
          certSelected = opt.code;
          document.getElementById('certValue').textContent = opt.desc;
          closeSheet();
        };
        box.appendChild(btn);
      });
      document.getElementById('sheetMask').hidden = false;
    }
    function closeSheet() { document.getElementById('sheetMask').hidden = true; }
    function apply() {
      // 旧校验顺序：身份证格式校验（cardid）→ 表单必填校验 → push/splice → 写 localStorage fellowInfo → 跳列表
      if (badCertDemo) {
        badCertDemo = false;
        showToast('身份证号码校验不通过，请检查后重新输入');
        return;
      }
      if (!document.getElementById('fellowName').value.trim()) { showToast('请输入访客姓名'); return; }
      if (!document.getElementById('certNo').value.trim()) { showToast('请输入证件号码'); return; }
      const action = isEdit ? '修改' : '添加';
      // 真实流程：写 localStorage fellowInfo → /xuchang/visitor/addPersonList?idHefei=true&cause=<cause>
      showToast(action + '成功，返回随行人员列表（addPersonList?idHefei=true&cause=…）');
    }
  </script>
</body>
</html>
