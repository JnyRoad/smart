<!doctype html>
<!--
  原型：入厂申请 - 手机验证 / 提交信息（访客预约 第 3 步，免登录）
  旧路由：/xuchang/visitor/tel
  旧组件：views-mobile/pages/visitor/tel.vue（+ visitor-steps、identifying-code 验证码组件、page3-bottom）
  接口：
    - GET  /sms/send/getCode/{mobile}          发送短信验证码（120s 倒计时）
    - GET  /sms/verify?mobile=&smsCode=        校验短信验证码
    - GET  /admittance/apply/app/area-options  提交前授权区域复核（剪除失效区域）
    - GET  /admittance/apply/enum/factory/type 授权区域旧回退接口
    - POST /wechat/visit/checkBlackVisitor     访客黑名单校验（非贵宾）
    - POST /admittance/apply/save/apply        提交入厂申请（含 fellowList / vehicleList）
  跳转：
    - 申请成功 → /xuchang/visitor/result
    - 授权区域失效为空 → 回 /xuchang/visitor/visitorInfo
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>入厂申请 · 手机验证</title>
<style>
:root {
  --brand-orange: #EC6C00;
  --accent-strong: #D95F00;
  --accent-soft: #FFF1E3;
  --accent-ink: #5A2600;
  --white: #FFFFFF;
  --surface: #F7F7F7;
  --yuto-black: #595757;
  --mid-gray: #8C8A8A;
  --weak-gray: #AAA7A7;
  --light-gray: #E5E3E3;
  --border-soft: #EFEEEE;
  --success: #16A673;
  --warning: #C98416;
  --danger: #D83B36;
  --info: #2376D9;
  --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
  --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
  --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--surface); color: var(--yuto-black); font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100dvh; background: linear-gradient(180deg, rgba(255,241,227,.72) 0, rgba(255,255,255,0) 220px), var(--surface); }
button, input { font: inherit; }
button { border: 0; cursor: pointer; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid rgba(236,108,0,.22); outline-offset: 2px; }

.demo-bar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: min(100%, 430px); margin: 0 auto; padding: 8px 12px; background: #2F2D2D; color: #fff; font-size: 12px; }
.demo-bar .tag { font-weight: 750; color: #FFC894; }
.demo-bar button { min-height: 28px; padding: 0 10px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 12px; }
.demo-bar button.on { background: var(--brand-orange); font-weight: 650; }

.app { position: relative; width: min(100%, 430px); margin: 0 auto; min-height: 100dvh; background: var(--white); box-shadow: var(--shadow-large); }
.page { min-height: 100dvh; padding: max(14px, env(safe-area-inset-top)) 18px calc(96px + max(24px, env(safe-area-inset-bottom))); background: linear-gradient(180deg, var(--accent-soft) 0, rgba(255,241,227,0) 220px), var(--white); }

.topbar { display: flex; align-items: center; min-height: 46px; gap: 10px; }
.back-btn { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-left: -10px; border-radius: 12px; color: var(--yuto-black); }
.back-btn svg { width: 22px; height: 22px; }
.page-title { flex: 1; text-align: center; font-size: 16px; font-weight: 750; }
.topbar-spacer { width: 44px; }

.steps { display: flex; align-items: flex-start; margin: 14px 2px 16px; }
.step { flex: 1; text-align: center; position: relative; }
.step .dot { width: 26px; height: 26px; margin: 0 auto; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--light-gray); color: var(--white); position: relative; z-index: 1; }
.step.active .dot { background: var(--brand-orange); box-shadow: 0 0 0 5px rgba(236,108,0,.15); }
.step.done .dot { background: var(--success); }
.step .lbl { margin-top: 7px; font-size: 12px; color: var(--weak-gray); }
.step.active .lbl { color: var(--accent-ink); font-weight: 650; }
.step + .step::before { content: ""; position: absolute; left: -50%; right: 50%; top: 12px; height: 2px; background: var(--light-gray); }
.step.done + .step::before { background: var(--brand-orange); }

.card { margin-top: 12px; padding: 18px 16px; border: 1px solid var(--border-soft); border-radius: 16px; background: var(--white); box-shadow: var(--shadow-panel); }
.card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 750; }
.card .sub { margin: 0 0 16px; font-size: 13px; color: var(--mid-gray); line-height: 1.6; }
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; margin-bottom: 7px; font-size: 13px; color: var(--mid-gray); }
.field label .req { color: var(--danger); margin-left: 2px; }
.field input { width: 100%; height: 48px; padding: 0 14px; border: 1px solid var(--border-soft); border-radius: 12px; background: var(--white); color: var(--yuto-black); }
.field input::placeholder { color: var(--weak-gray); }
.code-row { display: flex; gap: 10px; }
.code-row input { flex: 1; min-width: 0; }
.code-btn { flex: none; min-width: 112px; min-height: 48px; padding: 0 12px; border: 1.5px solid var(--brand-orange); border-radius: 12px; color: var(--brand-orange); font-size: 14px; font-weight: 650; background: var(--white); }
.code-btn[disabled] { border-color: var(--light-gray); color: var(--weak-gray); cursor: default; }

.summary { margin-top: 12px; }
.summary .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 13px; border-bottom: 1px dashed var(--border-soft); }
.summary .row:last-child { border-bottom: 0; }
.summary .k { color: var(--mid-gray); flex: none; }
.summary .v { text-align: right; color: var(--yuto-black); }

.footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 430px); padding: 12px 18px max(24px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.94); backdrop-filter: blur(8px); border-top: 1px solid var(--border-soft); z-index: 40; }
.primary-btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; border-radius: 14px; background: var(--brand-orange); color: var(--white); font-size: 16px; font-weight: 650; }
.primary-btn:active { background: var(--accent-strong); }
.primary-btn[disabled] { background: var(--light-gray); cursor: default; }
.spinner { width: 16px; height: 16px; margin-right: 8px; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 999px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); max-width: 320px; padding: 11px 18px; border-radius: 12px; background: rgba(47,45,45,.92); color: #fff; font-size: 13px; text-align: center; display: none; z-index: 60; }
.toast.show { display: block; }
.banner-danger { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(216,59,54,.10); color: var(--danger); font-size: 13px; line-height: 1.6; }
.banner-danger.show { display: block; }
</style>
</head>
<body>

<div class="demo-bar">
  <span class="tag">原型演示</span>
  <button class="on" onclick="setState('default', this)">默认</button>
  <button onclick="setState('countdown', this)">验证码倒计时</button>
  <button onclick="setState('submitting', this)">正在提交</button>
  <button onclick="setState('blacklist', this)">黑名单拦截</button>
</div>

<div class="app">
  <div class="page">
    <div class="topbar">
      <button class="back-btn" aria-label="返回" onclick="toast('返回上一步（/xuchang/visitor/visitorInfo）')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="page-title">入厂申请 · 提交信息</div>
      <div class="topbar-spacer"></div>
    </div>

    <!-- 步骤栏：当前第 3 步 -->
    <div class="steps">
      <div class="step done"><div class="dot">✓</div><div class="lbl">被访信息</div></div>
      <div class="step done"><div class="dot">✓</div><div class="lbl">访客信息</div></div>
      <div class="step active"><div class="dot">3</div><div class="lbl">提交信息</div></div>
    </div>

    <div class="banner-danger" id="blackBanner">抱歉，你已被加入访客黑名单，不能进行入厂申请!</div>

    <div class="card">
      <h2>手机验证</h2>
      <p class="sub">请填写访客本人手机号并完成短信验证，验证通过后将提交入厂申请。</p>

      <div class="field">
        <label>手机号<span class="req">*</span></label>
        <input type="tel" id="phone" inputmode="numeric" maxlength="11" placeholder="请输入" value="15936821407">
      </div>

      <div class="field">
        <label>验证码<span class="req">*</span></label>
        <div class="code-row">
          <input type="tel" id="smsCode" inputmode="numeric" maxlength="6" placeholder="请输入" value="">
          <button class="code-btn" id="codeBtn" onclick="sendCode()">获取验证码</button>
        </div>
      </div>
    </div>

    <!-- 本次申请摘要（来自前两步 localStorage 数据） -->
    <div class="card summary">
      <h2>本次申请信息</h2>
      <div class="row"><span class="k">被访人</span><span class="v">王建国 · 13837412589</span></div>
      <div class="row"><span class="k">访客姓名</span><span class="v">李晓梅</span></div>
      <div class="row"><span class="k">来访单位</span><span class="v">河南中烟工业有限责任公司</span></div>
      <div class="row"><span class="k">来访事由</span><span class="v">商务洽谈</span></div>
      <div class="row"><span class="k">授权区域</span><span class="v">新工厂 · 办公楼、展厅</span></div>
      <div class="row"><span class="k">来访时间</span><span class="v">2026-06-12 09:30</span></div>
      <div class="row"><span class="k">离开时间</span><span class="v">2026-06-12 17:30</span></div>
      <div class="row"><span class="k">随行人员</span><span class="v">2 人（张志强、陈雨桐）</span></div>
    </div>
  </div>

  <div class="footer">
    <button class="primary-btn" id="submitBtn" onclick="apply()">下一步</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let demoState = 'default';
let timer = null, left = 0;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2200);
}
function setState(s, btn) {
  demoState = s;
  document.querySelectorAll('.demo-bar button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('blackBanner').classList.toggle('show', s === 'blacklist');
  const submit = document.getElementById('submitBtn');
  if (s === 'submitting') {
    submit.disabled = true;
    submit.innerHTML = '<span class="spinner"></span>正在提交';
  } else {
    submit.disabled = false;
    submit.textContent = '下一步';
  }
  if (s === 'countdown') startCountdown(); else stopCountdown();
}
function startCountdown() {
  // 旧版倒计时时长 120s
  left = 120;
  const b = document.getElementById('codeBtn');
  b.disabled = true; b.textContent = left + 's';
  clearInterval(timer);
  timer = setInterval(() => {
    left--;
    if (left <= 0) { stopCountdown(); return; }
    b.textContent = left + 's';
  }, 1000);
}
function stopCountdown() {
  clearInterval(timer);
  const b = document.getElementById('codeBtn');
  b.disabled = false; b.textContent = '获取验证码';
}
function sendCode() {
  const p = document.getElementById('phone').value.trim();
  if (!p) { toast('请输入手机号'); return; }
  if (!/^1\d{10}$/.test(p)) { toast('手机号格式不正确'); return; }
  // 真实流程：GET /sms/send/getCode/{mobile}
  toast('发送成功');
  startCountdown();
}
function apply() {
  const p = document.getElementById('phone').value.trim();
  const c = document.getElementById('smsCode').value.trim();
  if (!p) { toast('请输入手机号'); return; }
  if (!/^1\d{10}$/.test(p)) { toast('手机号格式不正确'); return; }
  if (!c) { toast('请输入验证码'); return; }
  if (demoState === 'blacklist') { toast('抱歉，你已被加入访客黑名单，不能进行入厂申请!'); return; }
  // 真实流程：GET /sms/verify → 区域复核 → 黑名单校验 → POST /admittance/apply/save/apply
  toast('申请成功，前往结果页（/xuchang/visitor/result）');
}
</script>
</body>
</html>
