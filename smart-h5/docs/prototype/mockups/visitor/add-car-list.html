<!doctype html>
<!--
  原型：访客-车辆列表
  旧路由：/xuchang/visitor/addCarList
  旧组件：smart-h5/src/views-mobile/pages/visitor/add-car-list.vue
  接口：无（纯 localStorage carList 操作）
  跳转：
    新增车辆 → /xuchang/visitor/addCar
    编辑 → /xuchang/visitor/addCar?itemInfo=...&itemIndex=i&isEdit=true
    确定 → /xuchang/visitor/visitorInfo
  状态：已有车辆 / 空态
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>车辆列表 - 裕同智慧园区</title>
  <style>
    :root {
      --brand-orange: #EC6C00;
      --accent-strong: #D95F00;
      --accent-soft: #FFF1E3;
      --accent-ink: #5A2600;
      --white: #FFFFFF;
      --surface: #F7F7F7;
      --yuto-black: #595757;
      --mid-gray: #8C8A8A;
      --weak-gray: #AAA7A7;
      --light-gray: #E5E3E3;
      --border-soft: #EFEEEE;
      --success: #16A673;
      --warning: #C98416;
      --danger: #D83B36;
      --info: #2376D9;
      --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
      --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
      --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--surface); color: var(--yuto-black); font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
    body { margin: 0; min-height: 100dvh; }
    button { border: 0; cursor: pointer; background: none; font: inherit; color: inherit; }
    button:focus-visible { outline: 3px solid rgba(236, 108, 0, 0.22); outline-offset: 2px; }
    .app {
      position: relative; width: min(100%, 430px); min-height: 100dvh; margin: 0 auto;
      background: linear-gradient(180deg, var(--accent-soft) 0, var(--white) 220px) var(--white);
      box-shadow: var(--shadow-large); display: flex; flex-direction: column;
      padding-top: max(14px, env(safe-area-inset-top));
    }
    .demo-bar {
      margin: 0 16px 10px; padding: 8px 12px; border-radius: 12px;
      background: rgba(89, 87, 87, 0.06); border: 1px dashed var(--light-gray);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .demo-bar .demo-tag { font-size: 11px; font-weight: 700; color: var(--mid-gray); letter-spacing: 1px; }
    .demo-bar button {
      min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 650;
      background: var(--white); border: 1px solid var(--light-gray); color: var(--mid-gray);
    }
    .demo-bar button.on { background: var(--brand-orange); border-color: var(--brand-orange); color: var(--white); }
    .topbar { display: flex; align-items: center; min-height: 48px; padding: 0 6px; }
    .back-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
    .page-title { flex: 1; text-align: center; font-size: 16px; font-weight: 750; margin: 0; }
    .topbar-spacer { width: 44px; }
    .content { flex: 1; padding: 8px 16px 140px; }
    .count-tip { font-size: 13px; color: var(--mid-gray); margin: 4px 2px 12px; }
    .car-card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow-panel); padding: 16px; margin-bottom: 12px; }
    .car-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .plate-badge {
      display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px;
      border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink);
      font-size: 16px; font-weight: 750; letter-spacing: 1.5px;
    }
    .car-actions { display: flex; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
    .icon-btn:active { background: var(--surface); }
    .car-row { display: flex; font-size: 13px; padding-top: 10px; border-top: 1px solid var(--border-soft); }
    .car-row .lbl { color: var(--mid-gray); width: 78px; flex: none; }
    .car-row .val { flex: 1; min-width: 0; color: var(--yuto-black); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 空态 */
    .empty { text-align: center; padding: 90px 30px 0; }
    .empty-illu { width: 120px; height: 120px; margin: 0 auto 18px; border-radius: 999px; background: var(--accent-soft); display: grid; place-items: center; }
    .empty p { margin: 4px 0; color: var(--weak-gray); font-size: 14px; line-height: 1.6; }
    .footer {
      position: sticky; bottom: 0; display: flex; gap: 12px;
      padding: 12px 16px max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255,255,255,0) 0, var(--white) 30%);
    }
    .btn { flex: 1; height: 48px; border-radius: 14px; font-size: 16px; font-weight: 650; }
    .btn-secondary { background: var(--white); border: 1px solid var(--border-soft); color: var(--brand-orange); box-shadow: var(--shadow-panel); }
    .btn-primary { background: var(--brand-orange); color: var(--white); }
    .btn-primary:active { background: var(--accent-strong); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="demo-bar" role="group" aria-label="原型演示状态切换">
      <span class="demo-tag">原型演示</span>
      <button id="demoList" class="on" onclick="setState('list')">已有车辆</button>
      <button id="demoEmpty" onclick="setState('empty')">空态</button>
    </div>

    <header class="topbar">
      <button class="back-btn" aria-label="返回" onclick="location.href='visitor-info.html'">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 3.75 6.25 10l6.25 6.25" stroke="#595757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="page-title">车辆列表</h1>
      <span class="topbar-spacer"></span>
    </header>

    <main class="content">
      <!-- 列表状态 -->
      <section id="stateList">
        <p class="count-tip">已添加车辆（2辆）</p>

        <article class="car-card">
          <div class="car-head">
            <span class="plate-badge">豫A·D8326</span>
            <div class="car-actions">
              <button class="icon-btn" aria-label="编辑该车辆" title="编辑 → /xuchang/visitor/addCar（带 itemInfo/itemIndex/isEdit）">
                <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 12.8 12 3.8l2.2 2.2-9 9L2 16z" stroke="#8C8A8A" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
              </button>
              <button class="icon-btn" aria-label="删除该车辆" title="从 carList 中删除">
                <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 4.5h12M7 4.5V3h4v1.5M4.5 4.5 5.4 15h7.2l.9-10.5M7.5 7.5v5M10.5 7.5v5" stroke="#D83B36" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div class="car-row"><span class="lbl">司机姓名:</span><span class="val">王建国</span></div>
        </article>

        <article class="car-card">
          <div class="car-head">
            <span class="plate-badge">豫K·7B519</span>
            <div class="car-actions">
              <button class="icon-btn" aria-label="编辑该车辆">
                <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 12.8 12 3.8l2.2 2.2-9 9L2 16z" stroke="#8C8A8A" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
              </button>
              <button class="icon-btn" aria-label="删除该车辆">
                <svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 4.5h12M7 4.5V3h4v1.5M4.5 4.5 5.4 15h7.2l.9-10.5M7.5 7.5v5M10.5 7.5v5" stroke="#D83B36" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div class="car-row"><span class="lbl">司机姓名:</span><span class="val">李志强</span></div>
        </article>
      </section>

      <!-- 空态 -->
      <section id="stateEmpty" class="empty" hidden>
        <div class="empty-illu" aria-hidden="true">
          <svg width="58" height="58" viewBox="0 0 58 58"><path d="M10 36l4-12c.8-2.4 3-4 5.6-4h18.8c2.6 0 4.8 1.6 5.6 4l4 12" stroke="#EC6C00" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="34" width="42" height="12" rx="4" stroke="#EC6C00" stroke-width="2.4" fill="none"/><circle cx="17" cy="40" r="2.4" fill="#EC6C00"/><circle cx="41" cy="40" r="2.4" fill="#EC6C00"/></svg>
        </div>
        <p>暂无车辆信息</p>
        <p>请点击下方按钮添加车辆</p>
      </section>
    </main>

    <footer class="footer">
      <button class="btn btn-secondary" title="跳转 /xuchang/visitor/addCar" onclick="location.href='add-car.html'">新增车辆</button>
      <button class="btn btn-primary" title="跳转 /xuchang/visitor/visitorInfo" onclick="location.href='visitor-info.html'">确 定</button>
    </footer>
  </div>

  <script>
    function setState(s) {
      document.getElementById('demoList').classList.toggle('on', s === 'list');
      document.getElementById('demoEmpty').classList.toggle('on', s === 'empty');
      document.getElementById('stateList').hidden = s !== 'list';
      document.getElementById('stateEmpty').hidden = s !== 'empty';
    }
  </script>
</body>
</html>
