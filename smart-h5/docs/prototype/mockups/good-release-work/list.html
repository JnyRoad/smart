<!doctype html>
<!--
  原型：物品放行（办公区）- 查看数据（放行记录列表）
  旧路由：/xuchang/goodReleaseWork/list
  旧组件：smart-h5/src/views-mobile/pages/good-release-work/list.vue（page3-tab、cube-scroll、tce-empty）
  接口：GET /articlesrelease/office/page?badge=&type=5&current=&size=10（返回 records/pages）
  跳转：Tab「发起提交」→ index.html；点卡片 → detail.html?id=xx
  交互：下拉刷新（重置第1页）、上拉加载下一页、空态展示
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物品放行（办公区）· 查看数据</title>
<style>
:root {
  --brand-orange: #EC6C00;
  --accent-strong: #D95F00;
  --accent-soft: #FFF1E3;
  --accent-ink: #5A2600;
  --white: #FFFFFF;
  --surface: #F7F7F7;
  --yuto-black: #595757;
  --mid-gray: #8C8A8A;
  --weak-gray: #AAA7A7;
  --light-gray: #E5E3E3;
  --border-soft: #EFEEEE;
  --success: #16A673;
  --warning: #C98416;
  --danger: #D83B36;
  --info: #2376D9;
  --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
  --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
  --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--surface); color: var(--yuto-black); font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100dvh; }
button { border: 0; cursor: pointer; background: none; padding: 0; font: inherit; color: inherit; }
.app {
  width: min(100%, 430px); margin: 0 auto; min-height: 100dvh;
  background: var(--white); box-shadow: var(--shadow-large);
  display: flex; flex-direction: column; position: relative;
}
.page-bg { position: absolute; inset: 0 0 auto 0; height: 220px; background: linear-gradient(180deg, var(--accent-soft) 0, rgba(255,241,227,0) 100%); pointer-events: none; }
.topbar { position: relative; display: flex; align-items: center; min-height: 52px; padding: max(14px, env(safe-area-inset-top)) 6px 0; }
.nav-back { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.page-title { flex: 1; text-align: center; font-size: 16px; font-weight: 750; }
.nav-spacer { width: 44px; height: 44px; }
.tabs {
  position: relative; display: flex; gap: 8px; margin: 10px 16px 0;
  background: rgba(255,255,255,0.7); border: 1px solid var(--border-soft); border-radius: 14px; padding: 4px;
}
.tab { flex: 1; min-height: 44px; border-radius: 11px; font-size: 14px; font-weight: 650; color: var(--mid-gray); display: flex; align-items: center; justify-content: center; }
.tab.active { background: var(--brand-orange); color: var(--white); }
.content { position: relative; flex: 1; padding: 12px 16px max(24px, env(safe-area-inset-bottom)); }
.pull-hint { text-align: center; font-size: 12px; color: var(--weak-gray); padding: 6px 0 10px; }
.record {
  width: 100%; text-align: left; background: var(--white); border: 1px solid var(--border-soft);
  border-radius: 16px; box-shadow: var(--shadow-panel); padding: 16px; margin-bottom: 12px; display: block;
}
.record-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.record-title { font-size: 15px; font-weight: 700; line-height: 1.4; }
.badge {
  flex: none; border-radius: 999px; font-size: 12px; font-weight: 650; padding: 5px 10px; white-space: nowrap;
}
.badge--warning { color: var(--warning); background: rgba(201,132,22,0.12); }
.badge--success { color: var(--success); background: rgba(22,166,115,0.12); }
.badge--danger  { color: var(--danger);  background: rgba(216,59,54,0.12); }
.badge--info    { color: var(--info);    background: rgba(35,118,217,0.12); }
.record-rows { display: grid; gap: 8px; }
.row { display: flex; gap: 12px; font-size: 13px; line-height: 1.5; }
.row .label { color: var(--mid-gray); flex: none; width: 70px; }
.row .value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.load-more { text-align: center; font-size: 12px; color: var(--weak-gray); padding: 8px 0 16px; }
.empty { text-align: center; padding: 72px 24px; }
.empty .pic {
  width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 999px;
  background: var(--accent-soft); display: flex; align-items: center; justify-content: center;
}
.empty p { margin: 4px 0; color: var(--weak-gray); font-size: 14px; }
.demo-bar {
  position: relative; margin: 10px 16px 0; padding: 8px 10px; border: 1px dashed var(--brand-orange);
  border-radius: 12px; background: rgba(255,241,227,0.6); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.demo-bar .demo-tag { font-size: 11px; font-weight: 750; color: var(--accent-ink); flex: none; }
.demo-bar button { min-height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 650; border: 1px solid var(--light-gray); background: var(--white); color: var(--mid-gray); }
.demo-bar button.on { border-color: var(--brand-orange); background: var(--brand-orange); color: var(--white); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="page-bg"></div>
  <header class="topbar">
    <button class="nav-back" aria-label="返回" onclick="history.back()">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4 6.5 10l6 6" stroke="#595757" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="page-title">物品放行（办公区）</div>
    <div class="nav-spacer"></div>
  </header>

  <nav class="tabs">
    <button class="tab" onclick="location.href='index.html'">发起提交</button>
    <button class="tab active">查看数据</button>
  </nav>

  <div class="demo-bar" role="group" aria-label="原型演示">
    <span class="demo-tag">原型演示</span>
    <button id="d-list" class="on" onclick="setState('list')">有数据</button>
    <button id="d-emp" onclick="setState('empty')">空态</button>
  </div>

  <main class="content">
    <div id="state-list">
      <div class="pull-hint">下拉刷新 · 更新成功</div>

      <button class="record" onclick="location.href='detail.html?id=10086'">
        <div class="record-head">
          <div class="record-title">陈国栋提交的放行条</div>
          <span class="badge badge--warning">部门经理审批中</span>
        </div>
        <div class="record-rows">
          <div class="row"><span class="label">申请部门:</span><span class="value">裕同科技许昌分公司 · 研发设计部</span></div>
          <div class="row"><span class="label">放行事项:</span><span class="value">非保密物品放行</span></div>
          <div class="row"><span class="label">申请时间:</span><span class="value">2026-06-10 16:42:18</span></div>
          <div class="row"><span class="label">确认状态:</span><span class="value">未确认</span></div>
        </div>
      </button>

      <button class="record" onclick="location.href='detail.html?id=10085'">
        <div class="record-head">
          <div class="record-title">陈国栋提交的放行条</div>
          <span class="badge badge--success">审批通过</span>
        </div>
        <div class="record-rows">
          <div class="row"><span class="label">申请部门:</span><span class="value">裕同科技许昌分公司 · 研发设计部</span></div>
          <div class="row"><span class="label">放行事项:</span><span class="value">人员放行</span></div>
          <div class="row"><span class="label">申请时间:</span><span class="value">2026-06-08 09:15:03</span></div>
          <div class="row"><span class="label">确认状态:</span><span class="value">已确认返厂</span></div>
        </div>
      </button>

      <button class="record" onclick="location.href='detail.html?id=10081'">
        <div class="record-head">
          <div class="record-title">陈国栋提交的放行条</div>
          <span class="badge badge--info">已出厂</span>
        </div>
        <div class="record-rows">
          <div class="row"><span class="label">申请部门:</span><span class="value">裕同科技许昌分公司 · 研发设计部</span></div>
          <div class="row"><span class="label">放行事项:</span><span class="value">电脑放行</span></div>
          <div class="row"><span class="label">申请时间:</span><span class="value">2026-06-03 14:27:55</span></div>
          <div class="row"><span class="label">确认状态:</span><span class="value">无需确认</span></div>
        </div>
      </button>

      <button class="record" onclick="location.href='detail.html?id=10076'">
        <div class="record-head">
          <div class="record-title">陈国栋提交的放行条</div>
          <span class="badge badge--danger">审批拒绝</span>
        </div>
        <div class="record-rows">
          <div class="row"><span class="label">申请部门:</span><span class="value">裕同科技许昌分公司 · 研发设计部</span></div>
          <div class="row"><span class="label">放行事项:</span><span class="value">固定资产放行(不包含电脑)</span></div>
          <div class="row"><span class="label">申请时间:</span><span class="value">2026-05-28 11:06:40</span></div>
          <div class="row"><span class="label">确认状态:</span><span class="value">未确认</span></div>
        </div>
      </button>

      <div class="load-more">上拉加载更多 · 第 1/3 页</div>
    </div>

    <div id="state-empty" class="empty hidden">
      <div class="pic">
        <svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="7" y="12" width="30" height="22" rx="4" stroke="#EC6C00" stroke-width="2.4"/><path d="M7 19h30M16 12l3-5h6l3 5" stroke="#EC6C00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <p>暂无放行记录</p>
      <p>切换到「发起提交」提交新的放行申请</p>
    </div>
  </main>
</div>

<script>
function setState(s) {
  document.getElementById('state-list').classList.toggle('hidden', s !== 'list');
  document.getElementById('state-empty').classList.toggle('hidden', s !== 'empty');
  document.getElementById('d-list').classList.toggle('on', s === 'list');
  document.getElementById('d-emp').classList.toggle('on', s === 'empty');
}
</script>
</body>
</html>
