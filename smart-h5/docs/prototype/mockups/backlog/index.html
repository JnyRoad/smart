<!doctype html>
<!--
  原型：待办事项首页（审批侧入口聚合页）
  旧路由：/xuchang/backLog
  旧组件：smart-h5/src/views-mobile/pages/backLog/index.vue（page2-title、page2-list）
  接口：无（纯导航页）
  跳转：
    - 物品放行（生活区）→ /xuchang/backLog/goodReleaseLive（good-release-live-list.html）
    - 退宿审批 → /xuchang/backLog/dormExit
    - 园区报修审批 → /xuchang/backLog/dormRepairs
  备注：旧代码中访客审批/物品放行（办公区）/离职交接审批/员工申诉回复入口已被注释禁用，不实现。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>待办事项 · 裕同智慧园区</title>
  <style>
    :root {
      --brand-orange: #EC6C00;
      --accent-strong: #D95F00;
      --accent-soft: #FFF1E3;
      --accent-ink: #5A2600;
      --white: #FFFFFF;
      --surface: #F7F7F7;
      --yuto-black: #595757;
      --mid-gray: #8C8A8A;
      --weak-gray: #AAA7A7;
      --light-gray: #E5E3E3;
      --border-soft: #EFEEEE;
      --success: #16A673;
      --warning: #C98416;
      --danger: #D83B36;
      --info: #2376D9;
      --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
      --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
      --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html {
      background: var(--surface);
      color: var(--yuto-black);
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
    }
    body { margin: 0; min-height: 100dvh; }
    button { font: inherit; border: 0; cursor: pointer; background: none; }
    .app {
      width: min(100%, 430px);
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--white);
      box-shadow: var(--shadow-large);
      display: flex;
      flex-direction: column;
    }
    .page {
      flex: 1;
      padding: max(14px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(255, 241, 227, 0.72) 0, rgba(255, 255, 255, 0) 220px), var(--white);
    }
    .topbar {
      display: flex;
      align-items: center;
      min-height: 46px;
      gap: 6px;
    }
    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin-left: -10px;
      border-radius: 12px;
      color: var(--yuto-black);
    }
    .back-button:active { background: var(--accent-soft); }
    .topbar-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 750;
    }
    .topbar-spacer { width: 44px; }
    .hero-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 14px;
      padding: 20px 18px;
      border-radius: 16px;
      background: linear-gradient(120deg, var(--accent-soft), rgba(255, 241, 227, 0.35));
      border: 1px solid rgba(236, 108, 0, 0.14);
    }
    .hero-card h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      color: var(--yuto-black);
    }
    .hero-card p {
      margin: 8px 0 0;
      font-size: 13px;
      line-height: 1.6;
      color: var(--mid-gray);
    }
    .hero-art { flex: none; }
    .section-caption {
      margin: 22px 2px 10px;
      font-size: 13px;
      font-weight: 650;
      color: var(--mid-gray);
    }
    .entry-list { display: flex; flex-direction: column; gap: 12px; }
    .entry-item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 76px;
      padding: 16px;
      text-align: left;
      border-radius: 16px;
      background: var(--white);
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-panel);
      transition: transform 140ms ease;
    }
    .entry-item:active { transform: scale(0.985); background: #FFFBF7; }
    .entry-icon {
      flex: none;
      width: 46px;
      height: 46px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .entry-icon.goods { background: var(--accent-soft); color: var(--brand-orange); }
    .entry-icon.dorm { background: rgba(35, 118, 217, 0.10); color: var(--info); }
    .entry-icon.repair { background: rgba(22, 166, 115, 0.10); color: var(--success); }
    .entry-text { flex: 1; min-width: 0; }
    .entry-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--yuto-black);
      line-height: 1.35;
    }
    .entry-tip {
      margin-top: 4px;
      font-size: 13px;
      color: var(--mid-gray);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .entry-tip:empty { display: none; }
    .entry-arrow { flex: none; color: var(--weak-gray); }
    .foot-note {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: var(--weak-gray);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="page">
      <header class="topbar">
        <button class="back-button" aria-label="返回" onclick="history.back()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="topbar-title">待办事项</div>
        <div class="topbar-spacer" aria-hidden="true"></div>
      </header>

      <section class="hero-card">
        <div>
          <h1>待办事项</h1>
          <p>集中处理园区审批与工单，<br>待办不过夜。</p>
        </div>
        <div class="hero-art" aria-hidden="true">
          <svg width="84" height="84" viewBox="0 0 84 84" fill="none">
            <circle cx="42" cy="42" r="40" fill="rgba(236,108,0,0.10)"/>
            <rect x="24" y="20" width="36" height="44" rx="6" fill="#FFFFFF" stroke="#EC6C00" stroke-width="2.5"/>
            <path d="M31 32h22M31 41h22M31 50h13" stroke="#EC6C00" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="56" cy="56" r="11" fill="#16A673"/>
            <path d="M51.5 56l3 3 6-6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </section>

      <div class="section-caption">审批入口</div>
      <nav class="entry-list">
        <!-- 物品放行（生活区） → /xuchang/backLog/goodReleaseLive -->
        <button class="entry-item" onclick="location.href='good-release-live-list.html'">
          <span class="entry-icon goods" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
          </span>
          <span class="entry-text">
            <span class="entry-title">物品放行（生活区）</span>
            <span class="entry-tip"></span>
          </span>
          <span class="entry-arrow" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </span>
        </button>

        <!-- 退宿审批 → /xuchang/backLog/dormExit（本批次不含该页原型） -->
        <button class="entry-item" onclick="alert('跳转 /xuchang/backLog/dormExit（退宿审批，另批原型）')">
          <span class="entry-icon dorm" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-7h6v7M3 21h18"/></svg>
          </span>
          <span class="entry-text">
            <span class="entry-title">退宿审批</span>
            <span class="entry-tip"></span>
          </span>
          <span class="entry-arrow" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </span>
        </button>

        <!-- 园区报修审批 → /xuchang/backLog/dormRepairs（本批次不含该页原型） -->
        <button class="entry-item" onclick="alert('跳转 /xuchang/backLog/dormRepairs（园区报修审批，另批原型）')">
          <span class="entry-icon repair" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.7-3.7z"/></svg>
          </span>
          <span class="entry-text">
            <span class="entry-title">园区报修审批</span>
            <span class="entry-tip"></span>
          </span>
          <span class="entry-arrow" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </span>
        </button>
      </nav>

      <div class="foot-note">裕同智慧园区 · 待办事项</div>
    </div>
  </div>
</body>
</html>
