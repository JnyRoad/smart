<!doctype html>
<!--
  原型：宿舍报修（发起页）
  旧路由：/xuchang/dormRepairs（meta: 宿舍报修）
  旧组件：smart-h5/src/views-mobile/pages/dorm-repairs/index.vue
          + views-mobile/components/page3-tab.vue / page3-bottom.vue + pages/dorm-repairs/const.js
  接口：
    GET  app:/dormitory/repair/enum/range      维修区域枚举（services/dormRepairs.js dormRepairRange，失败 toast「网络错误」）
    POST platform:/dormitory/repair/add        提交报修（services/dormRepairs.js saveRepairRange）
  提交字段：rangeType、repairType、dormitoryName、roomName、faultDesc、faultImgs（base64）、parkId
  跳转：切换条「查看数据」→ /xuchang/dormRepairs/list；提交成功 → /xuchang/dormRepairs/list（无成功 toast）；失败 toast message
  联动：维修区域切换后「所在楼栋」选项联动并默认选中首项——
    宿舍(1)：老工厂1/2/3号宿舍、新工厂宿舍楼；办公室(2)：餐厅三楼、北门岗、东门岗、辅房；
    车间(3)：一楼、二楼、三楼；园区周边(4)：园区周边
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宿舍报修 - 裕同智慧园区</title>
<style>
:root {
  --brand-orange: #EC6C00;
  --accent-strong: #D95F00;
  --accent-soft: #FFF1E3;
  --accent-ink: #5A2600;
  --white: #FFFFFF;
  --surface: #F7F7F7;
  --yuto-black: #595757;
  --mid-gray: #8C8A8A;
  --weak-gray: #AAA7A7;
  --light-gray: #E5E3E3;
  --border-soft: #EFEEEE;
  --success: #16A673;
  --warning: #C98416;
  --danger: #D83B36;
  --info: #2376D9;
  --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
  --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
  --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--surface); color: var(--yuto-black); font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100dvh; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; cursor: pointer; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid rgba(236,108,0,.22); outline-offset: 2px; }
.app {
  position: relative; width: min(100%, 430px); min-height: 100dvh; margin: 0 auto;
  background: linear-gradient(180deg, var(--accent-soft) 0, rgba(255,241,227,0) 220px), var(--white);
  box-shadow: var(--shadow-large); display: flex; flex-direction: column;
}
.topbar { display: flex; align-items: center; min-height: 46px; padding: max(14px, env(safe-area-inset-top)) 6px 4px; }
.topbar .back { width: 44px; height: 44px; display: grid; place-items: center; color: var(--yuto-black); }
.topbar h1 { flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 750; }
.topbar .spacer { width: 44px; }
.seg-tab {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  margin: 8px 18px 0; padding: 4px; border-radius: 14px; background: rgba(236,108,0,.10);
}
.seg-tab button { min-height: 40px; border-radius: 11px; font-size: 14px; font-weight: 650; color: var(--accent-ink); }
.seg-tab button.cur { background: var(--brand-orange); color: var(--white); box-shadow: 0 6px 16px rgba(236,108,0,.28); }
.content { flex: 1; padding: 14px 18px 110px; }
.card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow-panel); padding: 16px; margin-bottom: 12px; }
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field-label { display: block; font-size: 13px; color: var(--mid-gray); margin-bottom: 6px; }
.field-label .req { color: var(--danger); margin-left: 2px; }
.picker, .input {
  width: 100%; min-height: 48px; border: 1px solid var(--border-soft); border-radius: 12px;
  background: var(--white); padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
  font-size: 15px; text-align: left;
}
input.input { display: block; }
.picker .ph, .input::placeholder { color: var(--weak-gray); }
.picker .val { color: var(--yuto-black); }
.picker svg { flex: none; margin-left: 8px; }
textarea.input { min-height: 88px; padding: 12px 14px; resize: vertical; display: block; width: 100%; }
.upload-row { display: flex; gap: 10px; }
.upload-thumb {
  width: 72px; height: 72px; border-radius: 12px; overflow: hidden; position: relative;
  border: 1px solid var(--border-soft); background: var(--surface);
}
.upload-thumb svg { width: 100%; height: 100%; display: block; }
.upload-add {
  width: 72px; height: 72px; border-radius: 12px; border: 1.5px dashed var(--light-gray);
  display: grid; place-items: center; color: var(--weak-gray); background: #FBFBFB;
}
.hint { margin-top: 8px; font-size: 12px; color: var(--weak-gray); }
.bottom-bar {
  position: sticky; bottom: 0; padding: 12px 18px max(24px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(255,255,255,0) 0, var(--white) 30%);
}
.btn-primary {
  width: 100%; min-height: 48px; border-radius: 14px; background: var(--brand-orange);
  color: var(--white); font-size: 16px; font-weight: 650;
}
.btn-primary:active { background: var(--accent-strong); }
/* 简易底部选项弹层（picker 原型演示） */
.sheet-mask { position: fixed; inset: 0; background: rgba(89,87,87,.4); display: none; z-index: 8; }
.sheet-mask.show { display: block; }
.sheet {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: min(100%, 430px);
  background: var(--white); border-radius: 18px 18px 0 0; padding: 14px 18px max(24px, env(safe-area-inset-bottom));
  transition: transform .25s; z-index: 9;
}
.sheet.show { transform: translate(-50%, 0); }
.sheet h3 { margin: 0 0 8px; font-size: 15px; font-weight: 750; text-align: center; }
.sheet .opts { max-height: 46dvh; overflow: auto; }
.sheet .opt {
  display: block; width: 100%; min-height: 46px; text-align: center; font-size: 15px;
  border-bottom: 1px solid var(--border-soft);
}
.sheet .opt:last-child { border-bottom: 0; }
.sheet .opt.sel { color: var(--brand-orange); font-weight: 700; }
.toast {
  position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%);
  background: rgba(89,87,87,.92); color: var(--white); font-size: 13px;
  padding: 10px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .25s;
  max-width: 80vw; text-align: center; z-index: 10;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back" aria-label="返回" title="返回 /xuchang/home" onclick="location.href='../home/index.html'">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4 6.5 10l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>宿舍报修</h1>
    <span class="spacer"></span>
  </header>

  <nav class="seg-tab" aria-label="模块切换">
    <button class="cur">发起提交</button>
    <button onclick="toast('原型演示：跳转 /xuchang/dormRepairs/list')">查看数据</button>
  </nav>

  <main class="content">
    <section class="card">
      <div class="field">
        <span class="field-label">维修区域<span class="req">*</span></span>
        <button class="picker" onclick="openSheet('range')">
          <span class="val" id="rangeVal">宿舍</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 5.5 7 8.5l3-3" stroke="#AAA7A7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="field">
        <span class="field-label">所在楼栋<span class="req">*</span></span>
        <!-- 选项随维修区域联动，切换区域后默认选中首项 -->
        <button class="picker" onclick="openSheet('dorm')">
          <span class="val" id="dormVal">老工厂1号宿舍</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 5.5 7 8.5l3-3" stroke="#AAA7A7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="field">
        <span class="field-label">维修类别<span class="req">*</span></span>
        <button class="picker" onclick="openSheet('repair')">
          <span class="val" id="repairVal">水龙头</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 5.5 7 8.5l3-3" stroke="#AAA7A7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="field">
        <span class="field-label">所在房间<span class="req">*</span></span>
        <input class="input" id="roomName" placeholder="请输入" value="302">
      </div>
      <div class="field">
        <span class="field-label">故障描述<span class="req">*</span></span>
        <textarea class="input" id="faultDesc" placeholder="请输入" rows="3">卫生间水龙头关不紧，一直滴水，地面有积水。</textarea>
      </div>
    </section>

    <section class="card">
      <div class="field">
        <span class="field-label">上传物品照片</span>
        <div class="upload-row">
          <div class="upload-thumb" aria-label="故障照片 1">
            <svg viewBox="0 0 72 72"><rect width="72" height="72" fill="#FFF1E3"/><circle cx="24" cy="26" r="7" fill="#EC6C00" opacity=".55"/><path d="M8 58 30 36l14 14 10-10 12 12v6H8Z" fill="#EC6C00" opacity=".35"/></svg>
          </div>
          <button class="upload-add" aria-label="添加照片" onclick="toast('原型演示：调起相机/相册（base64 上传）')">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <p class="hint">非必填；详情页最多展示 3 张照片</p>
      </div>
    </section>
  </main>

  <div class="bottom-bar">
    <button class="btn-primary" onclick="apply()">申请</button>
  </div>
</div>

<div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <h3 id="sheetTitle">请选择</h3>
  <div class="opts" id="sheetOpts"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// 旧 const.js 提取的功能事实：枚举选项（区域枚举优先取接口 /dormitory/repair/enum/range，下表为兜底）
const AREA = ['宿舍', '办公室', '车间', '园区周边'];
const DORM_BY_AREA = {
  '宿舍': ['老工厂1号宿舍', '老工厂2号宿舍', '老工厂3号宿舍', '新工厂宿舍楼'],
  '办公室': ['餐厅三楼', '北门岗', '东门岗', '辅房'],
  '车间': ['一楼', '二楼', '三楼'],
  '园区周边': ['园区周边']
};
const REPAIR = ['灯','插座','水龙头','水管','门窗','锁','空调','其他','床','柜子','玻璃','洗手台','桌椅','地漏'];
let curField = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}
function openSheet(field){
  curField = field;
  const map = {
    range: { title: '维修区域', opts: AREA, cur: rangeVal.textContent },
    dorm:  { title: '所在楼栋', opts: DORM_BY_AREA[rangeVal.textContent], cur: dormVal.textContent },
    repair:{ title: '维修类别', opts: REPAIR, cur: repairVal.textContent }
  };
  const cfg = map[field];
  document.getElementById('sheetTitle').textContent = cfg.title;
  document.getElementById('sheetOpts').innerHTML = cfg.opts.map(o =>
    `<button class="opt${o===cfg.cur?' sel':''}" onclick="pick('${o}')">${o}</button>`).join('');
  document.getElementById('sheetMask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheetMask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
function pick(v){
  if (curField === 'range') {
    rangeVal.textContent = v;
    // 旧逻辑：切换区域后所在楼栋联动并默认选中首项
    dormVal.textContent = DORM_BY_AREA[v][0];
  } else if (curField === 'dorm') {
    dormVal.textContent = v;
  } else {
    repairVal.textContent = v;
  }
  closeSheet();
}
function apply(){
  if (!document.getElementById('roomName').value.trim()) { toast('请输入所在房间'); return; }
  if (!document.getElementById('faultDesc').value.trim()) { toast('请输入故障描述'); return; }
  // 旧逻辑：提交成功无成功 toast，直接跳列表页；失败 toast 接口 message
  toast('原型演示：提交成功，跳转 /xuchang/dormRepairs/list');
}
const rangeVal = document.getElementById('rangeVal');
const dormVal = document.getElementById('dormVal');
const repairVal = document.getElementById('repairVal');
</script>
</body>
</html>
