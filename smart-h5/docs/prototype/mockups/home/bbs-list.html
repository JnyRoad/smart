<!doctype html>
<html lang="zh-CN">
<!--
  原型：公告列表
  旧路由：/xuchang/home/bbs/list
  旧组件：views-mobile/pages/home/bbs/list.vue
  接口：
    GET /home/bbs/list（badge=parkId, current=1, size=100）
  跳转：
    contentLinkType=1 外部链接 → window.location.href = bbsUrl
    contentLinkType=2 富文本 → /xuchang/home/bbs/detail?id={bbsId}&isPdf=false
    contentLinkType=4 PDF → /xuchang/home/bbs/detail?id={bbsId}&isPdf=true
    返回 → /xuchang/home
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>裕同智慧园区 · 园区公告</title>
<style>
:root {
  --brand-orange: #EC6C00;
  --accent-strong: #D95F00;
  --accent-soft: #FFF1E3;
  --accent-ink: #5A2600;
  --white: #FFFFFF;
  --surface: #F7F7F7;
  --yuto-black: #595757;
  --mid-gray: #8C8A8A;
  --weak-gray: #AAA7A7;
  --light-gray: #E5E3E3;
  --border-soft: #EFEEEE;
  --success: #16A673;
  --warning: #C98416;
  --danger: #D83B36;
  --info: #2376D9;
  --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
  --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
  --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--surface); color: var(--yuto-black); font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100dvh; }
button { font: inherit; border: 0; cursor: pointer; background: none; color: inherit; padding: 0; }
.app { width: min(100%, 430px); margin: 0 auto; min-height: 100dvh; background: var(--white); box-shadow: var(--shadow-large); position: relative; overflow: hidden; }
.page { min-height: 100dvh; padding-bottom: max(24px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, var(--accent-soft) 0, rgba(255,241,227,.35) 150px, var(--surface) 220px); }
.demo-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #3A3838; color: #fff; font-size: 12px; overflow-x: auto; }
.demo-bar .tag { flex: none; font-weight: 750; color: #FFC58A; }
.demo-bar button { flex: none; min-height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 12px; }
.demo-bar button.on { background: var(--brand-orange); font-weight: 650; }
.topbar { display: flex; align-items: center; padding: max(14px, env(safe-area-inset-top)) 8px 10px; }
.back { width: 44px; height: 44px; display: grid; place-items: center; color: var(--yuto-black); }
.title { flex: 1; text-align: center; font-size: 16px; font-weight: 750; }
.topbar .ph { width: 44px; }
.list { padding: 8px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.item { display: flex; align-items: center; gap: 14px; background: var(--white); border-radius: 16px; box-shadow: var(--shadow-panel); padding: 14px 16px; text-align: left; width: 100%; min-height: 44px; }
.thumb { flex: none; width: 60px; height: 60px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-size: 22px; }
.thumb.t1 { background: linear-gradient(135deg, var(--brand-orange), #F49A4A); }
.thumb.t2 { background: linear-gradient(135deg, var(--info), #6AA8EE); }
.thumb.t3 { background: linear-gradient(135deg, var(--success), #57C79E); }
.thumb.t4 { background: linear-gradient(135deg, var(--warning), #E0A953); }
.body { flex: 1; min-width: 0; }
.bbs-title { display: block; font-size: 15px; font-weight: 700; color: var(--yuto-black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bbs-type { margin-top: 6px; display: inline-flex; align-items: center; min-height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 650; }
.bbs-type.txt { background: rgba(35,118,217,.12); color: var(--info); }
.bbs-type.pdf { background: rgba(216,59,54,.12); color: var(--danger); }
.bbs-type.link { background: rgba(22,166,115,.12); color: var(--success); }
.arrow { flex: none; color: var(--weak-gray); }
.empty { display: none; flex-direction: column; align-items: center; padding: 70px 0 40px; }
.empty.show { display: flex; }
.empty-art { width: 96px; height: 96px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; color: var(--brand-orange); margin-bottom: 14px; }
.empty p { margin: 0; font-size: 14px; color: var(--weak-gray); }
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(58,56,56,.92); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; display: none; z-index: 40; white-space: nowrap; }
.loading-veil { position: absolute; inset: 0; background: rgba(255,255,255,.72); display: none; place-items: center; z-index: 20; }
.loading-veil.show { display: grid; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--brand-orange); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { padding: 12px 18px 0; font-size: 11px; color: var(--weak-gray); line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <div class="demo-bar">
    <span class="tag">原型演示</span>
    <button class="on" data-state="normal">正常列表</button>
    <button data-state="loading">加载中</button>
    <button data-state="empty">空态</button>
    <button data-state="error">加载失败</button>
  </div>

  <div class="page">
    <div class="topbar">
      <button class="back" onclick="demoToast('返回 /xuchang/home')" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="title">园区公告</span>
      <span class="ph"></span>
    </div>

    <div class="list" id="list">
      <button class="item" onclick="demoToast('跳转 /xuchang/home/bbs/detail?id=1001&isPdf=false')">
        <span class="thumb t1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l14-6v14L3 13v-2z"/><path d="M7 13v5a1 1 0 0 0 1 1h2"/></svg></span>
        <span class="body">
          <span class="bbs-title">关于五一假期园区门禁开放时间调整的通知</span>
          <span class="bbs-type txt">图文公告</span>
        </span>
        <span class="arrow">›</span>
      </button>
      <button class="item" onclick="demoToast('跳转 /xuchang/home/bbs/detail?id=1002&isPdf=true')">
        <span class="thumb t2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></span>
        <span class="body">
          <span class="bbs-title">裕同科技许昌园区宿舍管理制度（2026 修订版）</span>
          <span class="bbs-type pdf">PDF 文档</span>
        </span>
        <span class="arrow">›</span>
      </button>
      <button class="item" onclick="demoToast('外部链接：window.location.href = bbsUrl')">
        <span class="thumb t3"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12 19"/></svg></span>
        <span class="body">
          <span class="bbs-title">员工餐厅六月菜谱投票（点击参与）</span>
          <span class="bbs-type link">外部链接</span>
        </span>
        <span class="arrow">›</span>
      </button>
      <button class="item" onclick="demoToast('跳转 /xuchang/home/bbs/detail?id=1004&isPdf=false')">
        <span class="thumb t4"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg></span>
        <span class="body">
          <span class="bbs-title">关于开展夏季消防演练的通知（6 月 18 日 14:00）</span>
          <span class="bbs-type txt">图文公告</span>
        </span>
        <span class="arrow">›</span>
      </button>
    </div>

    <div class="empty" id="empty">
      <span class="empty-art"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l14-6v14L3 13v-2z"/><path d="M7 13v5a1 1 0 0 0 1 1h2"/></svg></span>
      <p>暂无公告</p>
    </div>

    <p class="note">注：列表来自 GET /home/bbs/list（size=100，不分页）；点击按 contentLinkType 分流：1 外链直跳、2 富文本详情、4 PDF 详情。</p>
  </div>

  <div class="loading-veil" id="veil"><div class="spinner"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
var toastTimer;
function demoToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.display = 'none'; }, 1800);
}
document.querySelectorAll('.demo-bar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.demo-bar button').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    document.getElementById('veil').classList.remove('show');
    document.getElementById('empty').classList.remove('show');
    document.getElementById('list').style.display = 'grid';
    switch(btn.dataset.state){
      case 'loading': document.getElementById('veil').classList.add('show'); break;
      case 'empty': document.getElementById('list').style.display = 'none'; document.getElementById('empty').classList.add('show'); break;
      case 'error': demoToast('网络错误'); break;
    }
  });
});
</script>
</body>
</html>
