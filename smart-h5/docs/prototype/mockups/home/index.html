<!doctype html>
<html lang="zh-CN">
<!--
  原型：首页
  旧路由：/xuchang/home
  旧组件：views-mobile/pages/home/index.vue
          + components/home-top.vue / home-msg.vue / nav-list.vue / park-list.vue
  接口：
    GET  /service/module/list          园区服务模块（动态宫格）
    GET  /home/bbs/list                最新公告（current=1,size=1,parkId）
    GET  /common/weather               天气（city=许昌）
    GET  /employee/fullinfo            用户全量信息（工号/姓名）
    GET  /employee/baseinfo            用户基本信息（status=0 已离职 → 强制退出）
    GET  /approve/list/new/page        物品放行待审批数（recordType=3,recordState=0）
    GET  /approve/list/repairs/list    园区报修待审批数（recordType=5,recordState=0）
    POST /dor/quit/list/approval       退宿待审批数（status=0）
    GET  /wechat/sign                  微信 JS-SDK 签名（「扫码放行」模块用）
  跳转：
    员工信息条 → /xuchang/mine
    公告条 → /xuchang/home/bbs/list
    审批宫格 → /xuchang/backLog/goodReleaseLive | /xuchang/backLog/dormRepairs | /xuchang/backLog/dormExit
    园区服务宫格 → /xuchang/dormRepairs | /xuchang/checkIn | /xuchang/dormExit | /xuchang/backLog
                 | /xuchang/goodReleaseLive | /xuchang/goodReleaseWork | /xuchang/returnFactory | /xuchang/dorm
    扫码放行 → 微信扫一扫，按二维码 type 跳对应审批详情
  备注：旧版「切换园区」弹层入口已注释（组件保留不可达），原型作演示状态保留。
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>裕同智慧园区 · 首页</title>
<style>
:root {
  --brand-orange: #EC6C00;
  --accent-strong: #D95F00;
  --accent-soft: #FFF1E3;
  --accent-ink: #5A2600;
  --white: #FFFFFF;
  --surface: #F7F7F7;
  --yuto-black: #595757;
  --mid-gray: #8C8A8A;
  --weak-gray: #AAA7A7;
  --light-gray: #E5E3E3;
  --border-soft: #EFEEEE;
  --success: #16A673;
  --warning: #C98416;
  --danger: #D83B36;
  --info: #2376D9;
  --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
  --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
  --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--surface); color: var(--yuto-black); font-family: var(--font-main); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100dvh; }
button { font: inherit; border: 0; cursor: pointer; background: none; color: inherit; padding: 0; }
.app { width: min(100%, 430px); margin: 0 auto; min-height: 100dvh; background: var(--white); box-shadow: var(--shadow-large); position: relative; overflow: hidden; }
.page { min-height: 100dvh; padding-bottom: max(24px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, var(--accent-soft) 0, rgba(255,241,227,.35) 150px, var(--surface) 260px); }

/* 演示切换条 */
.demo-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #3A3838; color: #fff; font-size: 12px; overflow-x: auto; }
.demo-bar .tag { flex: none; font-weight: 750; color: #FFC58A; }
.demo-bar button { flex: none; min-height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 12px; }
.demo-bar button.on { background: var(--brand-orange); font-weight: 650; }

/* 顶部品牌区 */
.hero { padding: max(14px, env(safe-area-inset-top)) 18px 18px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.wordmark { font-size: 16px; font-weight: 750; color: var(--yuto-black); display: flex; align-items: center; gap: 8px; }
.wordmark::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--brand-orange); }
.park-name { margin: 14px 0 4px; font-size: 21px; font-weight: 750; color: var(--yuto-black); display: flex; align-items: center; gap: 6px; }
.weather { font-size: 13px; color: var(--mid-gray); }
.staff-chip { margin-top: 14px; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--brand-orange); color: #fff; font-size: 14px; font-weight: 650; box-shadow: 0 8px 20px rgba(236,108,0,.28); }
.staff-chip .arrow { opacity: .85; }

/* 卡片 */
.cards { padding: 0 16px; display: grid; gap: 12px; }
.card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow-panel); padding: 16px; }

/* 公告条 */
.bbs-bar { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.bbs-icon { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); display: grid; place-items: center; color: var(--brand-orange); }
.bbs-text { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bbs-text.empty { color: var(--weak-gray); }
.arrow { flex: none; color: var(--weak-gray); font-size: 14px; }

/* 宫格 */
.section-title { display: inline-block; font-size: 16px; font-weight: 750; color: var(--brand-orange); padding-bottom: 6px; border-bottom: 2px solid var(--brand-orange); margin: 2px 0 14px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 4px; }
.grid-item { min-height: 44px; display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center; }
.grid-icon { position: relative; width: 46px; height: 46px; border-radius: 14px; background: var(--accent-soft); display: grid; place-items: center; color: var(--accent-strong); font-size: 20px; }
.grid-icon.blue { background: rgba(35,118,217,.10); color: var(--info); }
.grid-icon.green { background: rgba(22,166,115,.10); color: var(--success); }
.grid-icon.gold { background: rgba(201,132,22,.12); color: var(--warning); }
.badge { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); border: 1.5px solid #fff; color: #fff; font-size: 11px; font-weight: 650; line-height: 15px; }
.grid-label { font-size: 12px; color: var(--yuto-black); line-height: 1.3; }
.grid-tip { font-size: 11px; color: var(--weak-gray); margin-top: -4px; }

/* 离职弹窗 / 园区弹层 */
.mask { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none; z-index: 30; }
.mask.show { display: block; }
.dialog { position: absolute; left: 50%; top: 38%; transform: translate(-50%,-50%); width: 300px; background: #fff; border-radius: 16px; padding: 22px 20px 16px; text-align: center; }
.dialog h3 { margin: 0 0 10px; font-size: 16px; font-weight: 750; }
.dialog p { margin: 0 0 18px; font-size: 14px; color: var(--mid-gray); line-height: 1.6; }
.dialog .btn-primary { width: 100%; height: 48px; border-radius: 14px; background: var(--brand-orange); color: #fff; font-weight: 650; font-size: 15px; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 18px 18px 0 0; overflow: hidden; }
.sheet-top { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; background: #fff; }
.sheet-top .t { font-size: 17px; font-weight: 750; }
.sheet-top .ok { color: var(--brand-orange); font-weight: 650; font-size: 15px; min-height: 44px; padding: 0 6px; }
.sheet-body { background: #fff; margin-top: 8px; padding: 20px 16px max(24px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 12px; }
.park-opt { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--light-gray); background: var(--surface); color: var(--mid-gray); font-size: 14px; display: inline-flex; align-items: center; }
.park-opt.cur { border-color: var(--brand-orange); background: var(--accent-soft); color: var(--brand-orange); font-weight: 650; }

/* 状态层 */
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(58,56,56,.92); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; display: none; z-index: 40; white-space: nowrap; }
.loading-veil { position: absolute; inset: 0; background: rgba(255,255,255,.72); display: none; place-items: center; z-index: 20; }
.loading-veil.show { display: grid; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--brand-orange); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.note { padding: 14px 18px 0; font-size: 11px; color: var(--weak-gray); line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <div class="demo-bar">
    <span class="tag">原型演示</span>
    <button class="on" data-state="normal">正常</button>
    <button data-state="loading">加载中</button>
    <button data-state="empty-bbs">暂无公告</button>
    <button data-state="error">加载失败</button>
    <button data-state="quit">已离职弹窗</button>
    <button data-state="park">切换园区(旧版已隐藏)</button>
  </div>

  <div class="page">
    <div class="hero">
      <div class="brand-row">
        <span class="wordmark">裕同智慧园区</span>
      </div>
      <div class="park-name">裕同科技许昌园区</div>
      <div class="weather" id="weather">许昌 多云 27°C 东南风</div>
      <button class="staff-chip" onclick="go('/xuchang/mine')">
        <span>YT20180326</span><span>王建国</span><span class="arrow">›</span>
      </button>
    </div>

    <div class="cards">
      <!-- 公告条 -->
      <div class="card" style="padding:12px 16px;">
        <button class="bbs-bar" style="width:100%;" onclick="go('/xuchang/home/bbs/list')">
          <span class="bbs-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l14-6v14L3 13v-2z"/><path d="M7 13v5a1 1 0 0 0 1 1h2"/></svg>
          </span>
          <span class="bbs-text" id="bbsText">关于五一假期园区门禁开放时间调整的通知</span>
          <span class="arrow">›</span>
        </button>
      </div>

      <!-- 审批宫格（固定 3 项，带角标） -->
      <div class="card">
        <div class="grid">
          <button class="grid-item" onclick="go('/xuchang/backLog/goodReleaseLive')">
            <span class="grid-icon"><span class="badge">5</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
            </span>
            <span class="grid-label">宿舍物品<br>放行审批</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/backLog/dormRepairs')">
            <span class="grid-icon gold"><span class="badge">2</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.2 5.2L4 17l3 3 5.5-5.5a4 4 0 0 0 5.2-5.2l-2.6 2.6-2.5-2.5 2.1-3.1z"/></svg>
            </span>
            <span class="grid-label">园区报修<br>审批</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/backLog/dormExit')">
            <span class="grid-icon blue"><span class="badge">99+</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </span>
            <span class="grid-label">退宿审批</span>
          </button>
        </div>
      </div>

      <!-- 园区服务宫格（后端动态下发，含全部映射入口 + 扫码放行） -->
      <div class="card">
        <span class="section-title">园区服务</span>
        <div class="grid">
          <button class="grid-item" onclick="go('/xuchang/dormRepairs')">
            <span class="grid-icon gold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.2 5.2L4 17l3 3 5.5-5.5a4 4 0 0 0 5.2-5.2l-2.6 2.6-2.5-2.5 2.1-3.1z"/></svg></span>
            <span class="grid-label">园区报修</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/checkIn')">
            <span class="grid-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg></span>
            <span class="grid-label">宿舍申请</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/dormExit')">
            <span class="grid-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
            <span class="grid-label">退宿申请</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/backLog')">
            <span class="grid-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></span>
            <span class="grid-label">待审批</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/goodReleaseLive')">
            <span class="grid-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/></svg></span>
            <span class="grid-label">物品放行</span>
            <span class="grid-tip">(生活区)</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/goodReleaseWork')">
            <span class="grid-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
            <span class="grid-label">物品放行</span>
            <span class="grid-tip">(办公区)</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/returnFactory')">
            <span class="grid-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>
            <span class="grid-label">返厂确认</span>
          </button>
          <button class="grid-item" onclick="go('/xuchang/dorm')">
            <span class="grid-icon gold"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M4 20V8l8-5 8 5v12"/><rect x="9" y="13" width="6" height="7"/></svg></span>
            <span class="grid-label">我的宿舍</span>
          </button>
          <button class="grid-item" onclick="demoToast('调起微信扫一扫（演示）')">
            <span class="grid-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg></span>
            <span class="grid-label">扫码放行</span>
          </button>
        </div>
      </div>
    </div>

    <p class="note">注：园区服务宫格由后端 /service/module/list 动态下发；「扫码放行」调微信扫一扫，按二维码 type 跳退宿 / 办公区放行 / 生活区放行审批详情。角标 &gt;99 显示 99+。</p>
  </div>

  <!-- 已离职弹窗 -->
  <div class="mask" id="quitMask">
    <div class="dialog">
      <h3>提示</h3>
      <p>该用户已离职，已为你自动退出登录</p>
      <button class="btn-primary" onclick="hideMask('quitMask');demoToast('跳转微信授权 → 工牌登录页')">确定</button>
    </div>
  </div>

  <!-- 切换园区弹层（旧版入口已注释，仅演示保留） -->
  <div class="mask" id="parkMask" onclick="hideMask('parkMask')">
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="sheet-top"><span class="t">选择园区</span><button class="ok" onclick="hideMask('parkMask')">确定</button></div>
      <div class="sheet-body">
        <button class="park-opt cur">许昌园区</button>
        <button class="park-opt">石岩园区</button>
        <button class="park-opt">大岭山园区</button>
      </div>
    </div>
  </div>

  <div class="loading-veil" id="veil"><div class="spinner"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
function go(path){ demoToast('跳转 ' + path); }
var toastTimer;
function demoToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.display = 'none'; }, 1800);
}
function hideMask(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.demo-bar button').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('.demo-bar button').forEach(function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    document.getElementById('veil').classList.remove('show');
    hideMask('quitMask'); hideMask('parkMask');
    var bbs = document.getElementById('bbsText');
    bbs.textContent = '关于五一假期园区门禁开放时间调整的通知';
    bbs.classList.remove('empty');
    switch(btn.dataset.state){
      case 'loading': document.getElementById('veil').classList.add('show'); break;
      case 'empty-bbs': bbs.textContent = '暂无公告'; bbs.classList.add('empty'); break;
      case 'error': demoToast('数据加载失败'); break;
      case 'quit': document.getElementById('quitMask').classList.add('show'); break;
      case 'park': document.getElementById('parkMask').classList.add('show'); break;
    }
  });
});
</script>
</body>
</html>
