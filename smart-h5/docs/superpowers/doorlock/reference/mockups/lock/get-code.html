<!DOCTYPE html>
<!--
  原型：获取门锁动态码（人脸识别刷新）
  旧路由：/xuchang/dorm/getCode
  旧组件：smart-h5/src/views-mobile/pages/lock/get-code.vue + components/camera
  接口：
    POST /wechat/visit/checkFace（module=app，人脸比对，body: visitorPhoto=base64）
    POST /dormitory/staff/update/pwd（badge, facePic，刷新动态码）
  流程：拍照 → 人脸比对成功 → 点「生成动态码」→ 成功 alert「刷新动态码成功！」→ 跳 /xuchang/dorm/lock；失败 alert（标题「错误」+ 后端 msg）
  状态：待拍照（提示「请拍照」）/ 比对成功（「人脸对比成功」+ 生成按钮）/ 刷新成功 / 刷新失败
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>获取门锁动态码</title>
<style>
:root {
  --brand-orange: #EC6C00;
  --accent-strong: #D95F00;
  --accent-soft: #FFF1E3;
  --accent-ink: #5A2600;
  --white: #FFFFFF;
  --surface: #F7F7F7;
  --yuto-black: #595757;
  --mid-gray: #8C8A8A;
  --weak-gray: #AAA7A7;
  --light-gray: #E5E3E3;
  --border-soft: #EFEEEE;
  --success: #16A673;
  --warning: #C98416;
  --danger: #D83B36;
  --info: #2376D9;
  --shadow-large: 0 24px 70px rgba(89, 87, 87, 0.14);
  --shadow-panel: 0 16px 40px rgba(89, 87, 87, 0.10);
  --font-main: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-main); background: var(--surface); color: var(--yuto-black); }
.app {
  width: min(100%, 430px); margin: 0 auto; min-height: 100dvh;
  background: var(--white); box-shadow: var(--shadow-large);
  display: flex; flex-direction: column; position: relative; overflow: hidden;
}
.app::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 220px;
  background: linear-gradient(180deg, var(--accent-soft) 0%, rgba(255,241,227,0) 100%);
  pointer-events: none;
}
.topbar { position: relative; z-index: 2; padding: max(14px, env(safe-area-inset-top)) 6px 6px; display: flex; align-items: center; }
.back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; }
.back-btn svg { width: 22px; height: 22px; stroke: var(--yuto-black); }
.topbar-title { flex: 1; text-align: center; font-size: 16px; font-weight: 750; }
.topbar-spacer { width: 44px; }
.demo-bar {
  position: relative; z-index: 2; margin: 4px 16px 0; padding: 8px 12px;
  background: var(--accent-soft); border: 1px dashed var(--brand-orange); border-radius: 12px;
  display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent-ink); flex-wrap: wrap;
}
.demo-bar button { border: 1px solid var(--brand-orange); background: var(--white); color: var(--brand-orange); border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer; min-height: 28px; }
.demo-bar button.on { background: var(--brand-orange); color: var(--white); }
.headline { position: relative; z-index: 1; text-align: center; padding: 24px 16px 0; }
.headline h1 { font-size: 18px; font-weight: 750; }
.headline p { font-size: 14px; color: var(--mid-gray); margin-top: 6px; }
.camera-card {
  position: relative; z-index: 1; margin: 18px auto 0; width: 240px; height: 240px;
  border-radius: 16px; background: var(--white); border: 1px solid var(--border-soft);
  box-shadow: var(--shadow-panel); overflow: hidden; display: flex; align-items: center; justify-content: center;
}
.framing { position: absolute; inset: 14px; border: 2px dashed var(--brand-orange); border-radius: 14px; opacity: 0.6; pointer-events: none; }
.camera-card svg.face { width: 110px; height: 110px; }
.shot-btn {
  position: relative; z-index: 1; margin: 18px auto 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 200px; height: 48px; border-radius: 14px; border: none; background: var(--brand-orange);
  color: var(--white); font-size: 16px; font-weight: 650; cursor: pointer;
}
.shot-btn:active { background: var(--accent-strong); }
.shot-btn svg { width: 20px; height: 20px; stroke: var(--white); fill: none; stroke-width: 1.8; }
.status-line { position: relative; z-index: 1; text-align: center; margin-top: 18px; font-size: 16px; }
.status-line.wait { color: var(--mid-gray); }
.status-line.pass { color: var(--success); font-weight: 700; }
.gen-btn {
  position: relative; z-index: 1; margin: 16px auto 0; display: block;
  width: 200px; height: 48px; border-radius: 14px; border: none; background: var(--brand-orange);
  color: var(--white); font-size: 16px; font-weight: 650; cursor: pointer;
}
.gen-btn:active { background: var(--accent-strong); }
.foot { margin-top: auto; padding: 18px 0 max(24px, env(safe-area-inset-bottom)); text-align: center; font-size: 12px; color: var(--weak-gray); }
.mask { position: fixed; inset: 0; background: rgba(89,87,87,0.45); display: none; align-items: center; justify-content: center; z-index: 10; padding: 24px; }
.mask.show { display: flex; }
.alert-box { width: min(100%, 320px); background: var(--white); border-radius: 16px; padding: 26px 20px 16px; text-align: center; }
.alert-box .icon { width: 48px; height: 48px; margin: 0 auto 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.alert-box .icon.ok { background: rgba(22,166,115,0.12); }
.alert-box .icon.ok svg { stroke: var(--success); }
.alert-box .icon.err { background: rgba(216,59,54,0.12); }
.alert-box .icon.err svg { stroke: var(--danger); }
.alert-box .icon svg { width: 24px; height: 24px; fill: none; stroke-width: 2; }
.alert-box .a-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.alert-box .a-text { font-size: 14px; color: var(--mid-gray); line-height: 1.6; }
.alert-box .a-btn { margin-top: 18px; width: 100%; height: 44px; border: none; border-radius: 12px; background: var(--brand-orange); color: var(--white); font-size: 15px; font-weight: 650; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back-btn" aria-label="返回" onclick="alert('原型演示：返回 /xuchang/dorm/lock')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="topbar-title">获取门锁动态码</div>
    <div class="topbar-spacer"></div>
  </div>

  <div class="demo-bar">
    <span>原型演示</span>
    <button id="d1" class="on" onclick="setStage('wait')">待拍照</button>
    <button id="d2" onclick="setStage('pass')">比对成功</button>
    <button id="d3" onclick="showResult('ok')">刷新成功</button>
    <button id="d4" onclick="showResult('err')">刷新失败</button>
  </div>

  <div class="headline">
    <h1>刷新动态码</h1>
    <p>需完成人脸识别</p>
  </div>

  <div class="camera-card">
    <div class="framing"></div>
    <svg class="face" id="faceIcon" viewBox="0 0 96 96" fill="none">
      <circle cx="48" cy="48" r="44" fill="#FFF1E3"/>
      <circle cx="48" cy="40" r="13" stroke="#EC6C00" stroke-width="2.4"/>
      <path d="M26 74c4-12 12-18 22-18s18 6 22 18" stroke="#EC6C00" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>

  <button class="shot-btn" onclick="takePhoto()">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.4"/></svg>
    <span id="shotText">拍照</span>
  </button>

  <div class="status-line wait" id="statusLine">请拍照</div>
  <button class="gen-btn" id="genBtn" style="display:none" onclick="generate()">生成动态码</button>

  <div class="foot">裕同智慧园区 · 高保真原型</div>
</div>

<!-- 成功 alert -->
<div class="mask" id="okMask">
  <div class="alert-box">
    <div class="icon ok"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <div class="a-text">刷新动态码成功！</div>
    <button class="a-btn" onclick="document.getElementById('okMask').classList.remove('show');alert('原型演示：跳转 /xuchang/dorm/lock')">确定</button>
  </div>
</div>

<!-- 失败 alert -->
<div class="mask" id="errMask">
  <div class="alert-box">
    <div class="icon err"><svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.5" r="0.5"/><circle cx="12" cy="12" r="9.2"/></svg></div>
    <div class="a-title">错误</div>
    <div class="a-text">人脸照片与员工档案不匹配，刷新失败</div>
    <button class="a-btn" onclick="document.getElementById('errMask').classList.remove('show')">确定</button>
  </div>
</div>

<script>
function markDemo(id) {
  ['d1','d2','d3','d4'].forEach(function (k) { document.getElementById(k).className = k === id ? 'on' : ''; });
}
function setStage(s) {
  markDemo(s === 'wait' ? 'd1' : 'd2');
  var line = document.getElementById('statusLine');
  if (s === 'pass') {
    line.textContent = '人脸对比成功';
    line.className = 'status-line pass';
    document.getElementById('genBtn').style.display = 'block';
    document.getElementById('shotText').textContent = '重新拍照';
  } else {
    line.textContent = '请拍照';
    line.className = 'status-line wait';
    document.getElementById('genBtn').style.display = 'none';
    document.getElementById('shotText').textContent = '拍照';
  }
}
function takePhoto() { setStage('pass'); }
function generate() { showResult('ok'); }
function showResult(r) {
  markDemo(r === 'ok' ? 'd3' : 'd4');
  setStage('pass');
  document.getElementById(r === 'ok' ? 'okMask' : 'errMask').classList.add('show');
}
</script>
</body>
</html>
